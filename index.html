<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Burger King's Quest — Scheda Personaggio D&D 5.5e</title>
<meta name="theme-color" content="#502314">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BK Quest 5.5e">
<meta name="mobile-web-app-capable" content="yes">
<link id="pwa-icon" rel="icon" type="image/png">
<link id="pwa-apple-icon" rel="apple-touch-icon">
<link id="pwa-manifest" rel="manifest">
<script>
(function() {
  try {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#502314';
    ctx.beginPath();
    ctx.roundRect(0, 0, 512, 512, 110);
    ctx.fill();
    ctx.strokeStyle = '#FF8732';
    ctx.lineWidth = 22;
    ctx.stroke();

    // Bun top
    ctx.fillStyle = '#F5A623';
    ctx.beginPath();
    ctx.arc(256, 235, 145, Math.PI, 0, false);
    ctx.fill();

    // Patty & Red Flame
    ctx.fillStyle = '#D62300';
    ctx.beginPath();
    ctx.roundRect(102, 248, 308, 44, 22);
    ctx.fill();

    // Bun bottom
    ctx.fillStyle = '#F5A623';
    ctx.beginPath();
    ctx.roundRect(111, 306, 290, 46, 20);
    ctx.fill();

    // Crown text
    ctx.fillStyle = '#FFFDF9';
    ctx.font = '900 54px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BK QUEST', 256, 422);

    const iconUrl = c.toDataURL('image/png');
    document.getElementById('pwa-icon').href = iconUrl;
    document.getElementById('pwa-apple-icon').href = iconUrl;

    const manifest = {
      name: "Burger King's Quest — Scheda D&D 5.5e",
      short_name: "BK Quest 5.5e",
      description: "Scheda personaggio interattiva D&D 5.5e per Burger King's Quest",
      start_url: window.location.href.split('#')[0],
      display: "standalone",
      background_color: "#FBF6EE",
      theme_color: "#502314",
      orientation: "portrait",
      icons: [
        { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
  } catch (e) {}
})();
</script>

<style>
  :root {
    --bk-red: #D62300;
    --bk-red-dark: #9B1800;
    --bk-orange: #FF8732;
    --bk-gold: #F5A623;
    --bk-cream: #FBF6EE;
    --bk-paper: #FFFDF9;
    --bk-brown: #502314;
    --bk-brown-light: #7A3B26;
    --bk-green: #198754;
    --bk-border: #E5D5C3;
    --bk-ink: #24130D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bk-cream);
    color: var(--bk-ink);
    line-height: 1.4;
    padding-bottom: 40px;
  }

  /* TOP BAR */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bk-brown);
    color: #fff;
    border-bottom: 3px solid var(--bk-orange);
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  .topbar-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 8px 10px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-badge {
    background: var(--bk-red);
    color: #fff;
    font-weight: 900;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 999px;
    border: 1.5px solid var(--bk-gold);
    letter-spacing: 0.4px;
  }
  .brand-title h1 {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.3px;
    color: #FFFDF9;
  }
  .save-pill {
    font-size: 11px;
    background: rgba(25, 135, 84, 0.25);
    border: 1px solid #3dd598;
    color: #a3f7d4;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
  }

  .actions-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .btn {
    border: none;
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-lock { background: #3A2218; color: #F5A623; border: 1px solid #F5A623; }
  .btn-lock.unlocked { background: #F5A623; color: #24130D; }
  .btn-print { background: var(--bk-red); color: #fff; }
  .btn-util { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .btn-danger { background: rgba(214,35,0,0.25); color: #ffb3a6; border: 1px solid rgba(214,35,0,0.5); }

  /* FIXED 6-TAB GRID NAVIGATION (NO HORIZONTAL SCROLL) */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    background: rgba(0,0,0,0.25);
    padding: 4px;
    border-radius: 10px;
  }
  .nav-tab {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.75);
    padding: 6px 2px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 10px;
    font-weight: 700;
    transition: all 0.15s ease;
  }
  .nav-tab .ico { font-size: 15px; line-height: 1; }
  .nav-tab.active {
    background: var(--bk-cream);
    color: var(--bk-brown);
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  }

  
  /* WIZARD MODAL */
  #wizard-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9500;
    background: rgba(24, 10, 5, 0.78);
    padding: 12px;
    overflow-y: auto;
  }
  #wizard-modal.open { display: flex; align-items: flex-start; justify-content: center; }
  .wizard-box {
    background: var(--bk-paper);
    border: 2.5px solid var(--bk-gold);
    border-radius: 14px;
    width: 100%;
    max-width: 720px;
    padding: 14px;
    margin: 12px auto;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  .wizard-steps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .wiz-step-pill {
    font-size: 10px;
    font-weight: 800;
    text-align: center;
    padding: 5px 3px;
    border-radius: 6px;
    background: var(--bk-cream);
    color: #7a3b26;
    border: 1px solid var(--bk-border);
  }
  .wiz-step-pill.active {
    background: var(--bk-red);
    color: #fff;
    border-color: var(--bk-red);
  }
  .wiz-step-pill.done {
    background: #e8f5e9;
    color: #1b5e20;
    border-color: #2e7d32;
  }
  .search-box-row {
    margin-bottom: 8px;
  }

  /* DICE TOAST POPUP */
  #dice-toast {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translate(-50%, -130%);
    z-index: 9999;
    background: var(--bk-brown);
    color: #fff;
    border: 2px solid var(--bk-gold);
    border-radius: 14px;
    padding: 10px 16px;
    min-width: 250px;
    max-width: 92vw;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #dice-toast.show { transform: translate(-50%, 0); }
  #dice-toast.crit { border-color: #2ecc71; background: #153b24; }
  #dice-toast.fumble { border-color: #ff4d4d; background: #4a1212; }
  .toast-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--bk-gold); font-weight: 800; }
  .toast-detail { font-size: 12px; color: #f1e6db; margin-top: 2px; }
  .toast-total { font-size: 26px; font-weight: 900; color: #fff; background: var(--bk-red); padding: 4px 12px; border-radius: 10px; border: 1.5px solid var(--bk-gold); }

  /* CONTAINER & CARDS */
  .container { max-width: 960px; margin: 12px auto; padding: 0 10px; }
  .card {
    background: var(--bk-paper);
    border: 1.5px solid var(--bk-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(80,35,20,0.05);
  }
  .card-title {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--bk-brown);
    border-bottom: 2px solid var(--bk-border);
    padding-bottom: 6px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* FORM CONTROLS */
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1.5px solid var(--bk-border);
    border-radius: 8px;
    background: #fff;
    color: var(--bk-ink);
    font-size: 13px;
    font-family: inherit;
  }
  input:disabled, select:disabled, textarea:disabled {
    background: #F6EFE6;
    color: var(--bk-ink);
    border-color: transparent;
    font-weight: 600;
    opacity: 1;
  }
  label.lbl {
    display: block;
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--bk-brown-light);
    margin-bottom: 3px;
  }

  /* HERO HEADER & PORTRAIT */
  .hero-grid {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 12px;
    align-items: center;
  }
  .hero-fields {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .hero-row-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 74px;
    gap: 8px;
    align-items: end;
  }
  .hero-row-bot {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    align-items: end;
  }
  .hero-fields input, .hero-fields select {
    height: 36px;
    width: 100%;
    min-width: 0;
  }
  .portrait-box {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 3px solid var(--bk-red);
    background: #F3E6D8;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    flex-shrink: 0;
  }
  .portrait-box img { width: 100%; height: 100%; object-fit: cover; }
  .portrait-placeholder { font-size: 38px; }
  .portrait-upload {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(36,19,13,0.8);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    padding: 3px 0;
    cursor: pointer;
  }

  /* VITALS & STAT PILLS */
  .vitals-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  @media (min-width: 640px) {
    .vitals-grid { grid-template-columns: repeat(6, 1fr); }
  }
  .vital-box {
    background: var(--bk-cream);
    border: 1.5px solid var(--bk-border);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    min-height: 74px;
  }
  .vital-box.insp-active {
    background: linear-gradient(135deg, #FFF8E1 0%, #FFE082 100%);
    border: 2px solid #F5A623;
    box-shadow: 0 2px 8px rgba(245, 166, 35, 0.3);
  }
  .vital-box.insp-active .vital-val {
    color: #B26A00;
  }
  .vital-box.clickable { cursor: pointer; }
  .vital-box.clickable:hover { border-color: var(--bk-red); }
  .vital-lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--bk-brown-light); }
  .vital-val { font-size: 20px; font-weight: 900; color: var(--bk-brown); line-height: 1.15; margin-top: 2px; }
  .vital-sub { font-size: 10px; color: #7c6558; }

  /* HP BAR */
  .hp-panel {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    background: #FFF5F2;
    border: 1.5px solid #F3C4B8;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .hp-controls { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .rest-stack { display: flex; flex-direction: column; gap: 4px; }
  .rest-stack .hp-btn { padding: 4px 8px; font-size: 11px; white-space: nowrap; }
  .hp-btn {
    padding: 5px 9px;
    border-radius: 6px;
    border: none;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
  }
  .hp-dmg { background: var(--bk-red); color: #fff; }
  .hp-heal { background: var(--bk-green); color: #fff; }
  .hp-rest { background: var(--bk-brown); color: #fff; }

  /* ABILITY SCORES */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  @media (min-width: 640px) {
    .stats-grid { grid-template-columns: repeat(6, 1fr); }
  }
  .stat-card {
    background: var(--bk-cream);
    border: 1.5px solid var(--bk-border);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat-mod {
    font-size: 22px;
    font-weight: 900;
    color: var(--bk-red);
    cursor: pointer;
    padding: 2px 0;
  }
  .stat-save-row {
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed var(--bk-border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
  }

  /* SKILLS LIST */
  .skill-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px solid #F0E6DA;
    font-size: 13px;
  }
  .skill-row:last-child { border-bottom: none; }
  .prof-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--bk-brown);
    background: #fff;
    font-size: 10px;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 7px;
  }
  .prof-dot.p1 { background: var(--bk-brown); color: #fff; }
  .prof-dot.p2 { background: var(--bk-red); color: var(--bk-gold); border-color: var(--bk-red); }
  .roll-pill {
    background: var(--bk-cream);
    border: 1.5px solid var(--bk-border);
    border-radius: 7px;
    padding: 3px 9px;
    font-weight: 800;
    font-size: 12.5px;
    color: var(--bk-brown);
    cursor: pointer;
  }
  .roll-pill:hover { background: var(--bk-red); color: #fff; border-color: var(--bk-red); }

  /* ACCORDION ITEMS (CONCISE + EXPANDABLE) */
  .acc-item {
    border: 1.5px solid var(--bk-border);
    border-radius: 9px;
    margin-bottom: 6px;
    background: #fff;
    overflow: hidden;
  }
  .acc-head {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    background: var(--bk-cream);
  }
  .acc-title { font-weight: 800; font-size: 13px; color: var(--bk-ink); }
  .acc-tag {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--bk-brown);
    color: #fff;
    white-space: nowrap;
  }
  .acc-body {
    display: none;
    padding: 9px 11px;
    font-size: 12.5px;
    color: #3d2820;
    border-top: 1px solid var(--bk-border);
    background: #FFFDF9;
  }
  .acc-item.open .acc-body { display: block; }

  /* BITE RULE BANNER */
  .bite-banner {
    background: linear-gradient(135deg, #502314 0%, #8C1D04 100%);
    color: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* CHECKBOX GRID */
  .chk-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    font-size: 12px;
  }
  @media (min-width: 640px) {
    .chk-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .chk-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    background: var(--bk-cream);
    border-radius: 6px;
  }

  /* DICE TRAY */
  .dice-btns {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .die-btn {
    background: var(--bk-brown);
    color: #fff;
    border: 2px solid var(--bk-gold);
    border-radius: 10px;
    padding: 12px 6px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
  }

  /* ================= OFFICIAL 2-PAGE PRINT TEMPLATE ================= */
  #print-sheet { display: none; }

  @media print {
    @page { size: A4 portrait; margin: 6mm; }
    body { background: #fff !important; padding: 0 !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .topbar, .container, #dice-toast { display: none !important; }
    #print-sheet { display: block !important; font-family: Arial, Helvetica, sans-serif; color: #111; }

    .bk-page {
      width: 100%;
      min-height: 282mm;
      border: 2.5px solid #111;
      padding: 6mm;
      position: relative;
      background: #fff;
      box-sizing: border-box;
    }
    .bk-page-break { page-break-after: always; }

    .bk-crown-top {
      text-align: center;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 1px;
      background: #111;
      color: #fff;
      display: inline-block;
      padding: 2px 12px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .bk-frame {
      border: 2px solid #111;
      border-radius: 8px;
      padding: 5px 7px;
      background: #fff;
    }
    .bk-lbl {
      font-size: 7.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #111;
    }
    .bk-black-pill {
      background: #111;
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      padding: 2px 4px;
      border-radius: 3px;
      margin-bottom: 2px;
    }
    .p1-header {
      display: grid;
      grid-template-columns: 74px 1fr 64px 165px;
      gap: 6px;
      align-items: stretch;
      margin-bottom: 6px;
    }
    .p1-portrait {
      width: 74px; height: 74px;
      border: 2.5px solid #111;
      border-radius: 50%;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .p1-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .p1-line { border-bottom: 1px solid #333; padding: 2px 0; font-size: 10.5px; font-weight: 700; }

    .p1-stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 6px;
    }
    .p1-stat-box { border: 2px solid #111; border-radius: 6px; padding: 3px 4px; text-align: center; }
    .p1-stat-main { display: flex; justify-content: space-around; align-items: center; margin: 2px 0; }
    .p1-score { border: 1.5px solid #111; border-radius: 4px; padding: 2px 6px; font-size: 13px; font-weight: 900; }
    .p1-mod { font-size: 13px; font-weight: 900; }
    .p1-save { border-top: 1px solid #555; font-size: 8.5px; padding-top: 2px; font-weight: 700; }

    .p1-mid {
      display: grid;
      grid-template-columns: 155px 1fr 112px;
      gap: 6px;
      margin-bottom: 6px;
    }
    .p1-skill-line {
      display: flex;
      justify-content: space-between;
      font-size: 8.2px;
      border-bottom: 0.5px solid #ccc;
      padding: 1.4px 0;
    }
    .p1-badge-box { border: 2px solid #111; border-radius: 6px; padding: 3px; text-align: center; margin-bottom: 4px; }

  for (const cat of INGREDIENT_CATEGORIES) {
    const found = cat.items.find(it => it.name === ingName);

}

let state = loadState();


const SCHEMA_VERSION = 4;

function migrateState(rawObj) {
  const base = defaultState();
  if (!rawObj || typeof rawObj !== "object") return base;

  const src = (rawObj.data && typeof rawObj.data === "object")
    ? rawObj.data
    : ((rawObj.character && typeof rawObj.character === "object") ? rawObj.character : rawObj);

  const merged = Object.assign({}, base, src);

  merged.stats = Object.assign({}, base.stats, (src.stats && typeof src.stats === "object") ? src.stats : {});
  merged.saveProfs = Object.assign({}, base.saveProfs, (src.saveProfs && typeof src.saveProfs === "object") ? src.saveProfs : {});
  merged.skillProfs = Object.assign({}, base.skillProfs, (src.skillProfs && typeof src.skillProfs === "object") ? src.skillProfs : {});
  merged.burgerPantry = Object.assign({}, base.burgerPantry, (src.burgerPantry && typeof src.burgerPantry === "object") ? src.burgerPantry : {});
  merged.friesPantry = Object.assign({}, base.friesPantry, (src.friesPantry && typeof src.friesPantry === "object") ? src.friesPantry : {});
  merged.ingredients = Object.assign({}, base.ingredients, (src.ingredients && typeof src.ingredients === "object") ? src.ingredients : {});
  merged.tools = Object.assign({}, base.tools, (src.tools && typeof src.tools === "object") ? src.tools : {});

  const dsSrc = (src.deathSaves && typeof src.deathSaves === "object") ? src.deathSaves : {};
  merged.deathSaves = {
    succ: [0, 1, 2].map(i => Boolean(Array.isArray(dsSrc.succ) ? dsSrc.succ[i] : false)),
    fail: [0, 1, 2].map(i => Boolean(Array.isArray(dsSrc.fail) ? dsSrc.fail[i] : false))
  };

  const slotsSrc = (src.spellSlots && typeof src.spellSlots === "object") ? src.spellSlots : {};
  merged.spellSlots = {};
  [1, 2, 3, 4, 5].forEach(lvl => {
    const s = slotsSrc[lvl] || slotsSrc[String(lvl)] || {};
    const maxVal = Math.max(0, Number(s.max || 0));
    const usedVal = Math.max(0, Math.min(maxVal || 99, Number(s.used || 0)));
    merged.spellSlots[lvl] = { max: maxVal, used: usedVal };
  });

  merged.weapons = Array.isArray(src.weapons)
    ? src.weapons.map(w => Object.assign({ name: "Arma", dice: "1d6", dmgType: "Contundente", stat: "FOR", magicBonus: 0, mastery: "", props: "" }, w || {}))
    : [];

  merged.spells = Array.isArray(src.spells)
    ? src.spells.map(sp => Object.assign({ level: 1, name: "Incantesimo", time: "1 Azione", range: "18 m", prep: true, note: "" }, sp || {}))
    : [];

  merged.magicItems = Array.isArray(src.magicItems)
    ? src.magicItems.map(it => Object.assign({ name: "Oggetto Magico", active: true, charges: 0, maxCharges: 0, note: "" }, it || {}))
    : [];

  merged.gearItems = Array.isArray(src.gearItems)
    ? src.gearItems.map(g => Object.assign({ name: "Oggetto", qty: 1, category: "Attrezzatura", note: "" }, g || {}))
    : (src.inventory && String(src.inventory).trim()
        ? [{ name: String(src.inventory).trim(), qty: 1, category: "Attrezzatura", note: "" }]
        : []);
  merged.silver = Math.max(0, Number(merged.silver || 0));
  merged.copper = Math.max(0, Number(merged.copper || 0));

  merged.level = Math.max(1, Math.min(20, Number(merged.level || 1)));
  merged.xp = Math.max(0, Number(merged.xp || 0));
  merged.hpMax = Math.max(1, Number(merged.hpMax || 12));
  merged.hpCurrent = Math.max(0, Math.min(merged.hpMax, Number(merged.hpCurrent ?? merged.hpMax)));
  merged.hpTemp = Math.max(0, Number(merged.hpTemp || 0));
  merged.hdUsed = Math.max(0, Math.min(merged.level, Number(merged.hdUsed || 0)));
  merged.exhaustion = Math.max(0, Math.min(6, Number(merged.exhaustion || 0)));
  merged.gold = Number(merged.gold || 0);
  merged.schemaVersion = SCHEMA_VERSION;

  return merged;
}

function encodeHashState(obj) {
  try {
    const copy = Object.assign({}, obj, { portrait: "" }); // keep URL compact
    const json = JSON.stringify(copy);
    return btoa(unescape(encodeURIComponent(json)));
  } catch (e) {
    return "";
  }
}

function decodeHashState(hashStr) {
  try {
    const clean = String(hashStr || "").replace(/^#s=/, "");
    if (!clean) return null;
    const json = decodeURIComponent(escape(atob(clean)));
    return JSON.parse(json);
  } catch (e) {
    return null;
  }
}

function loadState() {
  // 1. Try localStorage
  try {
    const keysToTry = [STORAGE_KEY, "bk_quest_55e_v2", "bk_quest_55e_v1"];
    for (const k of keysToTry) {
      const raw = localStorage.getItem(k);
      if (raw) {
        const parsed = JSON.parse(raw);
        return migrateState(parsed);
      }
    }
  } catch (e) {}

  // 2. Fallback: window.name (survives F5 / pull-to-refresh on file:// and sandboxed iframes!)
  try {
    if (typeof window.name === "string" && window.name.startsWith("BK_QUEST_STATE:")) {
      const parsed = JSON.parse(window.name.slice("BK_QUEST_STATE:".length));
      return migrateState(parsed);
    }
  } catch (e) {}

  // 3. Fallback: URL hash (#s=...) for file:// hard reloads
  try {
    if (window.location.hash && window.location.hash.startsWith("#s=")) {
      const parsed = decodeHashState(window.location.hash);
      if (parsed) return migrateState(parsed);
    }
  } catch (e) {}

  return defaultState();
}

function saveNow() {
  clearTimeout(saveTimer);
  const pill = document.getElementById("save-status");
  const serialized = JSON.stringify(state);
  let savedLocal = false;
  let savedWinName = false;

  try {
    localStorage.setItem(STORAGE_KEY, serialized);
    savedLocal = true;
  } catch (e) {}

  try {
    window.name = "BK_QUEST_STATE:" + serialized;
    savedWinName = true;
  } catch (e) {}

  // On file:// protocol, also mirror compact state into URL hash so even hard refresh preserves everything
  try {
    if (window.location.protocol === "file:" || !savedLocal) {
      const encoded = encodeHashState(state);
      if (encoded && encoded.length < 32000) {
        history.replaceState(null, "", "#s=" + encoded);
      }
    }
  } catch (e) {}

  if (pill) {
    if (savedLocal) pill.textContent = "✓ Salvato";
    else if (savedWinName) pill.textContent = "✓ Salvato (Sessione)";
    else pill.textContent = "⚠️ Usa ⬇️ JSON";
  }
}

function scheduleSave() {
  saveNow();
}

window.addEventListener("beforeprint", saveNow);
window.addEventListener("pagehide", saveNow);
window.addEventListener("beforeunload", saveNow);
window.addEventListener("pageshow", function(ev) {
  if (ev.persisted) {
    state = loadState();
    renderApp();
  }
});

function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function getPB() {
  return Math.floor((Number(state.level || 1) - 1) / 4) + 2;
}

function getMod(score) {
  return Math.floor((Number(score || 10) - 10) / 2);
}

function fmtMod(m) {
  return m >= 0 ? `+${m}` : `${m}`;
}

function getActiveBurgerObj() {
  return BURGERS_DATA.find(b => b.id === state.activeBurger) || null;
}

function getActiveFriesObj() {
  return FRIES_DATA.find(f => f.id === state.activeFries) || null;
}


function hasShieldInInventory() {
  if (state.hasShield) return true;
  const invText = String(state.inventory || "").toLowerCase();
  const notesText = String(state.notes || "").toLowerCase();
  const otherText = String(state.otherProfs || "").toLowerCase();
  return /scudo/i.test(invText) || /scudo/i.test(notesText) || /scudo/i.test(otherText);
}

function getCalculatedAC() {
  const dexMod = getMod(state.stats.DES);
  let baseAC = 10 + dexMod;
  if (state.armorIndex >= 0 && state.armorIndex < ARMOR_PRESETS.length) {
    const ar = ARMOR_PRESETS[state.armorIndex];
    baseAC = ar.base + Math.min(dexMod, ar.dexCap);
  } else {
    baseAC = Number(state.customArmorBase || 10);
  }
  const shield = state.hasShield ? 2 : 0;
  const burgerAC = (getActiveBurgerObj()?.bonusType === "ac") ? getActiveBurgerObj().bonusVal : 0;
  return baseAC + shield + Number(state.miscAcBonus || 0) + burgerAC;
}

function getInitiative() {
  let init = getMod(state.stats.DES);
  if (state.species === "Umano" && state.originFeat.startsWith("Allerta")) {
    init += getPB();
  }
  return init;
}

function getSpeed() {
  let spd = SPECIES_DATA[state.species]?.speed || 9;
  if (state.activeFries === "fries_chili") spd += 3;
  spd -= Number(state.exhaustion || 0) * 1.5;
  return Math.max(0, spd);
}

function getSkillBonus(skill) {
  const base = getMod(state.stats[skill.stat]);
  const prof = Number(state.skillProfs[skill.id] || 0) * getPB();
  const burgerCheck = (getActiveBurgerObj()?.bonusType === "check") ? getActiveBurgerObj().bonusVal : 0;
  return base + prof + burgerCheck;
}

function getSaveBonus(statKey) {
  const base = getMod(state.stats[statKey]);
  const prof = state.saveProfs[statKey] ? getPB() : 0;
  const burgerSave = (getActiveBurgerObj()?.bonusType === "save") ? getActiveBurgerObj().bonusVal : 0;
  const friesSave = (state.activeFries === "fries_bacon") ? 1 : 0;
  return base + prof + burgerSave + friesSave;
}

function getPassivePerception() {
  const percSkill = SKILLS_LIST.find(s => s.id === "percezione");
  let pp = 10 + getSkillBonus(percSkill);
  if (state.activeFries === "fries_onion") pp += 5;
  return pp;
}

function showDiceToast(title, detail, total, d20Raw = null) {
  const toast = document.getElementById("dice-toast");
  document.getElementById("toast-title").textContent = title;
  document.getElementById("toast-detail").textContent = detail;
  document.getElementById("toast-total").textContent = total;
  toast.classList.remove("crit", "fumble");
  if (d20Raw === 20) toast.classList.add("crit");
  if (d20Raw === 1) toast.classList.add("fumble");
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3600);
}

function rollD20(label, bonus) {
  const d = Math.floor(Math.random() * 20) + 1;
  const exhPen = Number(state.exhaustion || 0) * 2;
  const total = d + bonus - exhPen;
  const penTxt = exhPen > 0 ? ` - ${exhPen} (Esaur.)` : "";
  const critTxt = d === 20 ? " • CRITICO!" : (d === 1 ? " • FALLIMENTO CRITICO!" : "");
  showDiceToast(label, `1d20 (${d}) ${fmtMod(bonus)}${penTxt}${critTxt}`, total, d);
}

function rollFormula(label, formula) {
  const m = String(formula).trim().match(/^(\d+)d(\d+)([+-]\d+)?$/i);
  if (!m) {
    const val = Math.floor(Math.random() * 20) + 1;
    showDiceToast(label, `1d20 (${val})`, val, val);
    return val;
  }
  const count = parseInt(m[1], 10);
  const sides = parseInt(m[2], 10);
  const mod = m[3] ? parseInt(m[3], 10) : 0;
  let rolls = [];
  let sum = 0;
  for (let i = 0; i < count; i++) {
    const r = Math.floor(Math.random() * sides) + 1;
    rolls.push(r);
    sum += r;
  }
  const total = sum + mod;
  const modTxt = mod !== 0 ? (mod > 0 ? ` + ${mod}` : ` - ${Math.abs(mod)}`) : "";
  showDiceToast(label, `${count}d${sides} [${rolls.join("+")}]${modTxt}`, total, sides === 20 && count === 1 ? rolls[0] : null);
  return total;
}

function handlePortraitUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = 220;
      canvas.height = 220;
      const ctx = canvas.getContext("2d");
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2;
      const sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 220, 220);
      state.portrait = canvas.toDataURL("image/jpeg", 0.72);
      scheduleSave();
      renderApp();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function adjustHP(delta) {
  if (delta < 0) {
    let dmg = Math.abs(delta);
    if (state.hpTemp > 0) {
      const absorbed = Math.min(state.hpTemp, dmg);
      state.hpTemp -= absorbed;
      dmg -= absorbed;
    }
    state.hpCurrent = Math.max(0, state.hpCurrent - dmg);
  } else {
    state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + delta);
  }
  scheduleSave();
  renderApp();
}

function spendHitDie() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const maxHD = Number(state.level || 1);
  const usedHD = Number(state.hdUsed || 0);
  if (usedHD >= maxHD) {
    showDiceToast("Dadi Vita Esauriti", `Hai già speso tutti i ${maxHD}d${cls.hd} disponibili!`, "0 DV");
    return;
  }
  const conMod = getMod(state.stats.COS);
  const roll = Math.floor(Math.random() * cls.hd) + 1;
  const healed = Math.max(1, roll + conMod);
  state.hdUsed = usedHD + 1;
  const prevHP = state.hpCurrent;
  state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + healed);
  const actualHealed = state.hpCurrent - prevHP;
  scheduleSave();
  renderApp();
  showDiceToast(
    `Dado Vita Speso (1d${cls.hd})`,
    `Tiro (${roll}) ${fmtMod(conMod)} COS = +${healed} PF (recuperati ${actualHealed} PF) • Rimasti: ${maxHD - state.hdUsed}/${maxHD}`,
    `+${healed} PF`
  );
}

function shortRest() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const maxHD = Number(state.level || 1);
  const availHD = Math.max(0, maxHD - Number(state.hdUsed || 0));
  let notes = [];
  if (cls.pactMagic) {
    Object.keys(state.spellSlots).forEach(lvl => { state.spellSlots[lvl].used = 0; });
    notes.push("Slot Magia del Patto ripristinati");
  }
  notes.push(`Dadi Vita disponibili: ${availHD}/${maxHD} d${cls.hd}`);
  scheduleSave();
  renderApp();
  showDiceToast("Riposo Breve (1 ora)", notes.join(" • ") + " — Usa 'Spendi DV' per curarti!", "☕");
}

function longRest() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  state.hpCurrent = state.hpMax;
  state.hpTemp = 0;
  state.hdUsed = 0;
  state.deathSaves = { succ: [false, false, false], fail: [false, false, false] };
  state.exhaustion = Math.max(0, Number(state.exhaustion || 0) - 1);
  if (state.species === "Umano") state.inspiration = true;
  Object.keys(state.spellSlots).forEach(lvl => { state.spellSlots[lvl].used = 0; });
  state.magicItems.forEach(it => { if (it.maxCharges) it.charges = it.maxCharges; });
  scheduleSave();
  renderApp();
  showDiceToast("Riposo Lungo Completato", `PF massimi, tutti i ${state.level}d${cls.hd} Dadi Vita, slot e cariche ripristinati!`, "🏕️");
}

function eatBurger(id) {
  const b = BURGERS_DATA.find(x => x.id === id);
  if (!b) return;
  if ((state.burgerPantry[id] || 0) > 0) {
    state.burgerPantry[id]--;
  }
  const healed = rollFormula(`Morso: ${b.name}`, b.heal);
  state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + healed);
  state.activeBurger = id;
  scheduleSave();
  renderApp();
}

function eatFries(id) {
  const f = FRIES_DATA.find(x => x.id === id);
  if (!f) return;
  if ((state.friesPantry[id] || 0) > 0) {
    state.friesPantry[id]--;
  }
  state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + 1);
  state.activeFries = id;
  showDiceToast(`King Fries: ${f.name}`, f.desc, "+1 PF");
  scheduleSave();
  renderApp();
}

function syncInventoryTextFromGear() {
  state.inventory = (state.gearItems || [])
    .filter(g => Number(g.qty || 0) > 0)
    .map(g => `${g.qty > 1 ? g.qty + "× " : ""}${g.name}${g.note ? " (" + g.note + ")" : ""}`)
    .join("\n");
}

function addGearPreset() {
  const sel = document.getElementById("gear-preset-sel");
  if (!sel) return;
  const gp = GEAR_PRESETS[Number(sel.value)];
  if (!gp) return;
  const existing = state.gearItems.find(x => x.name === gp.name);
  if (existing) {
    existing.qty = Number(existing.qty || 0) + Number(gp.qty || 1);
  } else {
    state.gearItems.push({ ...gp });
  }
  syncInventoryTextFromGear();
  scheduleSave();
  renderApp();
  showDiceToast("Oggetto Aggiunto", `${gp.qty > 1 ? gp.qty + "× " : ""}${gp.name}`, "🎒");
}

function addCustomGearItem() {
  const nameEl = document.getElementById("custom-gear-name");
  const qtyEl = document.getElementById("custom-gear-qty");
  const catEl = document.getElementById("custom-gear-cat");
  const noteEl = document.getElementById("custom-gear-note");
  const name = (nameEl?.value || "").trim();
  if (!name) return;
  const qty = Math.max(1, Number(qtyEl?.value || 1));
  const category = catEl?.value || "Attrezzatura";
  const note = (noteEl?.value || "").trim();
  state.gearItems.push({ name, qty, category, note });
  syncInventoryTextFromGear();
  scheduleSave();
  renderApp();
  showDiceToast("Oggetto Aggiunto", `${qty}× ${name}`, "🎒");
}

function filterGearList(q) {
  const term = (q || "").toLowerCase().trim();
  document.querySelectorAll("#app-content .gear-row").forEach(el => {
    el.style.display = !term || el.textContent.toLowerCase().includes(term) ? "" : "none";
  });
}

let selectedCraftRecipeIdx = 0;

function isRecipeCraftable(recipe) {
  return Object.keys(recipe.req || {}).every(ing => Number(state.ingredients[ing] || 0) >= Number(recipe.req[ing] || 0));
}

function craftSelectedFood() {
  const sel = document.getElementById("craft-recipe-sel");
  const idx = sel ? Number(sel.value) : selectedCraftRecipeIdx;
  selectedCraftRecipeIdx = idx;
  const rec = CRAFTING_RECIPES[idx];
  if (!rec) return;

  if (!isRecipeCraftable(rec)) {
    showDiceToast("Ingredienti Insufficienti", `Non hai abbastanza ingredienti nella dispensa per preparare ${rec.name}.`, "⚠️");
    return;
  }

  Object.keys(rec.req).forEach(ing => {
    state.ingredients[ing] = Math.max(0, Number(state.ingredients[ing] || 0) - Number(rec.req[ing] || 0));
  });

  if (rec.outType === "burger") {
    state.burgerPantry[rec.outId] = Number(state.burgerPantry[rec.outId] || 0) + 1;
  } else {
    state.friesPantry[rec.outId] = Number(state.friesPantry[rec.outId] || 0) + 1;
  }

  scheduleSave();
  renderApp();
  showDiceToast("Preparazione Completata!", `Hai cucinato 1× ${rec.name} ed è stato aggiunto alla tua bisaccia!`, "🍽️");
}

function previewSpellCatalog(idx) {
  const sp = SPELL_CATALOG[Number(idx)];
  const el = document.getElementById("spell-catalog-preview");
  if (sp && el) el.textContent = `${sp.time} • Gittata ${sp.range} — ${sp.note}`;
}

function addSpellFromCatalog() {
  const sel = document.getElementById("spell-catalog-sel");
  if (!sel) return;
  const sp = SPELL_CATALOG[Number(sel.value)];
  if (!sp) return;
  if (state.spells.some(x => x.name.toLowerCase() === sp.name.toLowerCase())) {
    showDiceToast("Già presente", `${sp.name} è già nel tuo grimorio.`, "!");
    return;
  }
  state.spells.push({ level: sp.level, name: sp.name, time: sp.time, range: sp.range, prep: true, note: sp.note });
  state.spells.sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
  scheduleSave();
  renderApp();
  showDiceToast("Incantesimo Aggiunto", sp.name, sp.level === 0 ? "0°" : sp.level + "°");
}

function autoLoadSubclassSpells() {
  const mapByClass = {
    "Druido": ["Intrappolare", "Bacca Benefica", "Crescita di Spine", "Restaurazione Inferiore", "Crescita Vegetale", "Evoca Animali", "Tralcio Afferrante", "Piaga"],
    "Bardo": ["Controllare Fiamme", "Produrre Fiamma", "Sfera Infuocata"],
    "Chierico": ["Individuazione del Magico", "Camuffare Sé Stessi", "Vedere Invisibilità", "Calmare Emozioni", "Chiaroveggenza", "Schema Ipnotico", "Occhio Arcano", "Invisibilità Superiore", "Scrutare", "Modificare Memoria"],
    "Warlock": ["Creare Falò", "Controllare Fiamme", "Deflagrazione Occulta (Fuoco)", "Assorbire Elementi", "Mani Brucianti", "Sfera Infuocata", "Raggio Rovente", "Palla di Fuoco", "Protezione dall'Energia", "Muro di Fuoco", "Evoca Elementale (Fuoco)", "Immolazione", "Colonna di Fiamma"],
    "Mago": ["Controllare Acqua (Trucchetto)", "Controllare Fiamme", "Modellare la Terra", "Folata di Vento (Trucchetto)", "Mani Brucianti", "Raggio Rovente", "Palla di Fuoco", "Muro di Fuoco"],
    "Paladino": state.paladinSchool === "King's Blade"
      ? ["Punizione Ustionante", "Mani Brucianti", "Raggio Rovente", "Punizione Marchiante", "Palla di Fuoco", "Arma Elementale (Fuoco)", "Muro di Fuoco", "Scudo di Fuoco (Caldo)", "Colpo Infuocato", "Immolazione"]
      : ["Eroismo", "Assorbire Elementi", "Vincolo Protettivo", "Scudo della Fede", "Tempesta di Nevischio", "Protezione dall'Energia", "Tempesta di Ghiaccio", "Libertà di Movimento", "Cono di Freddo", "Muro di Ghiaccio"]
  };
  const list = mapByClass[state.className] || [];
  if (!list.length) {
    showDiceToast("Nessuna lista innata", `${state.className} non ha incantesimi di sottoclasse automatici.`, "—");
    return;
  }
  const maxSpellLvl = state.className === "Paladino"
    ? (state.level >= 17 ? 5 : state.level >= 13 ? 4 : state.level >= 9 ? 3 : state.level >= 5 ? 2 : state.level >= 2 ? 1 : 0)
    : Math.min(5, Math.ceil(state.level / 2));

  let added = 0;
  list.forEach(name => {
    const sp = SPELL_CATALOG.find(x => x.name === name);
    if (sp && sp.level <= maxSpellLvl && !state.spells.some(x => x.name === sp.name)) {
      state.spells.push({ level: sp.level, name: sp.name, time: sp.time, range: sp.range, prep: true, note: sp.note });
      added++;
    }
  });
  state.spells.sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
  scheduleSave();
  renderApp();
  showDiceToast("Incantesimi Sottoclasse", added > 0 ? `Aggiunti ${added} incantesimi fino al ${maxSpellLvl}° liv.` : "Tutti gli incantesimi del tuo livello sono già presenti!", `+${added}`);
}

function renderPrintSheet() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const sp = SPECIES_DATA[state.species] || SPECIES_DATA["Umano"];
  const pb = getPB();
  const ac = getCalculatedAC();
  const init = getInitiative();
  const spd = getSpeed();
  const pp = getPassivePerception();
  const casterStat = cls.caster || "—";
  const spellDC = cls.caster ? (8 + pb + getMod(state.stats[cls.caster])) : "—";
  const spellAtk = cls.caster ? fmtMod(pb + getMod(state.stats[cls.caster])) : "—";
  const prepCount = state.spells.filter(s => s.prep && s.level > 0).length;

  const statsPrint = Object.keys(state.stats).map(k => `
    <div class="p1-stat-box">
      <div class="bk-lbl">${k}</div>
      <div class="p1-stat-main">
        <span class="p1-score">${state.stats[k]}</span>
        <span class="p1-mod">${fmtMod(getMod(state.stats[k]))}</span>
      </div>
      <div class="p1-save">${state.saveProfs[k] ? "●" : "○"} ${fmtMod(getSaveBonus(k))} Tiro salvezza</div>
    </div>
  `).join("");

  const skillsPrint = SKILLS_LIST.map(sk => {
    const p = Number(state.skillProfs[sk.id] || 0);
    const mark = p === 2 ? "◉" : (p === 1 ? "●" : "○");
    return `<div class="p1-skill-line"><span>${mark} ${fmtMod(getSkillBonus(sk))} ${sk.name} (${sk.stat.slice(0,3)})</span></div>`;
  }).join("");

  const weaponsPrint = state.weapons.map(w => {

function hasMagicAccess() {
  const cls = CLASSES_DATA[state.className];
  if (cls && cls.caster) return true;
  if (state.species === "Umano" && String(state.originFeat || "").startsWith("Iniziato alla Magia")) return true;
  return false;
}

function syncMagicTabVisibility() {
  const hasMag = hasMagicAccess();
  const magBtn = document.querySelector('.nav-tab[data-tab="magic"]');
  const navGrid = document.getElementById("nav-tabs");
  if (magBtn) magBtn.style.display = hasMag ? "" : "none";
  if (navGrid) navGrid.style.gridTemplateColumns = hasMag ? "repeat(6, 1fr)" : "repeat(5, 1fr)";
  if (!hasMag && currentTab === "magic") {
    currentTab = "home";
    document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === "home"));
  }
}

function renderApp() {
  syncMagicTabVisibility();
  document.getElementById("top-char-name").textContent = state.name || "Eroe della Griglia";
  const inspBadge = document.getElementById("top-insp-badge");
  if (inspBadge) {
    inspBadge.textContent = state.inspiration ? "★ Ispirazione Eroica" : "☆ No Ispirazione";
    inspBadge.style.background = state.inspiration ? "#F5A623" : "rgba(255,255,255,0.1)";
    inspBadge.style.color = state.inspiration ? "#24130D" : "rgba(255,255,255,0.65)";
    inspBadge.style.borderColor = state.inspiration ? "#F5A623" : "rgba(255,255,255,0.25)";
  }
  const main = document.getElementById("app-content");
  if (currentTab === "home") main.innerHTML = renderHomeTab();
  else if (currentTab === "stats") main.innerHTML = renderStatsTab();
  else if (currentTab === "combat") main.innerHTML = renderCombatTab();
  else if (currentTab === "bk") main.innerHTML = renderBKTab();
  else if (currentTab === "food") main.innerHTML = renderFoodTab();
  else if (currentTab === "magic") main.innerHTML = renderMagicTab();
  renderPrintSheet();
}


function exportJSON() {
  const payload = Object.assign({}, migrateState(state), {
    _meta: { app: "BurgerKingsQuest", schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString() }
  });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${(state.name || "personaggio").toLowerCase().replace(/[^a-z0-9]+/g, "_")}_bk_quest.json`;
  a.click();
}

function importJSON(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const parsed = JSON.parse(ev.target.result);
      state = migrateState(parsed);
      scheduleSave();
      renderApp();
      showDiceToast("Scheda Caricata", `Benvenuto ${state.name}!`, "OK");
    } catch (err) {
      alert("File JSON non valido.");
    }
  };
  reader.readAsText(file);
}

let wizSpeciesSkills = [];
let wizClassSkills = [];

function syncWizardSkillProfs() {
  const spRule = SPECIES_SKILL_RULES[state.species];
  const clsRule = CLASS_SKILL_RULES[state.className];
  if (spRule) {
    wizSpeciesSkills = wizSpeciesSkills.filter(id => spRule.pool.includes(id)).slice(0, spRule.count);
  } else {
    wizSpeciesSkills = [];
  }
  if (clsRule) {
    wizClassSkills = wizClassSkills.filter(id => clsRule.pool.includes(id) && !wizSpeciesSkills.includes(id)).slice(0, clsRule.count);
  } else {
    wizClassSkills = [];
  }
  state.skillProfs = {};
  [...wizSpeciesSkills, ...wizClassSkills].forEach(id => { state.skillProfs[id] = 1; });
}

function toggleWizSpeciesSkill(skillId) {
  const rule = SPECIES_SKILL_RULES[state.species];
  if (!rule) return;
  const idx = wizSpeciesSkills.indexOf(skillId);
  if (idx >= 0) {
    wizSpeciesSkills.splice(idx, 1);
  } else {
    if (wizSpeciesSkills.length >= rule.count) {
      if (rule.count === 1) wizSpeciesSkills = [skillId];
      else {
        showDiceToast("Limite Raggiunto", `Puoi selezionare al massimo ${rule.count} abilità per la specie ${state.species}.`, "!");
        return;
      }
    } else {
      wizSpeciesSkills.push(skillId);
    }
  }
  syncWizardSkillProfs();
  renderWizard();
}

function toggleWizClassSkill(skillId) {
  const rule = CLASS_SKILL_RULES[state.className];
  if (!rule) return;
  if (wizSpeciesSkills.includes(skillId)) {
    showDiceToast("Già Selezionata", "Questa abilità è già stata scelta come competenza di specie.", "✓");
    return;
  }
  const idx = wizClassSkills.indexOf(skillId);
  if (idx >= 0) {
    wizClassSkills.splice(idx, 1);
  } else {
    if (wizClassSkills.length >= rule.count) {
      showDiceToast("Limite Raggiunto", `Puoi selezionare al massimo ${rule.count} abilità per la classe ${state.className}.`, "!");
      return;
    }
    wizClassSkills.push(skillId);
  }
  syncWizardSkillProfs();
  renderWizard();
}

function filterSelectOptions(inputId, selectId) {
  const q = (document.getElementById(inputId)?.value || "").toLowerCase().trim();
  const sel = document.getElementById(selectId);
  if (!sel) return;
  let firstVisible = -1;
  Array.from(sel.options).forEach((opt, i) => {
    const match = !q || opt.textContent.toLowerCase().includes(q);
    opt.style.display = match ? "" : "none";
    if (match && firstVisible === -1) firstVisible = i;
  });
  if (firstVisible !== -1 && sel.options[sel.selectedIndex]?.style.display === "none") {
    sel.selectedIndex = firstVisible;
  }
}

function filterWeaponCards(q) {
  const term = (q || "").toLowerCase().trim();
  document.querySelectorAll("#app-content .acc-item").forEach(el => {
    if (el.id && el.id.startsWith("food-")) return;
    el.style.display = !term || el.textContent.toLowerCase().includes(term) ? "" : "none";
  });
}

function filterFoodList(q) {
  const term = (q || "").toLowerCase().trim();
  document.querySelectorAll("#app-content [id^='food-']").forEach(el => {
    el.style.display = !term || el.textContent.toLowerCase().includes(term) ? "" : "none";
  });
  document.querySelectorAll("#app-content .chk-item").forEach(el => {
    el.style.display = !term || el.textContent.toLowerCase().includes(term) ? "" : "none";
  });
  document.querySelectorAll("#app-content .ing-cat-group").forEach(grp => {
    const visibleItems = Array.from(grp.querySelectorAll(".chk-item")).some(it => it.style.display !== "none");
    grp.style.display = !term || visibleItems ? "" : "none";
  });
}

function openWizard() {
  if (!confirm("Vuoi avviare la procedura guidata per creare un nuovo personaggio da manuale? I dati attuali non esportati verranno azzerati.")) return;
  state = defaultState();
  wizStep = 1;
  wizSpeciesSkills = [];
  wizClassSkills = [];
  document.getElementById("wizard-modal").classList.add("open");
  renderWizard();
}

function closeWizard() {
  document.getElementById("wizard-modal").classList.remove("open");
  scheduleSave();
  renderApp();
}

function applyStandardArray(order) {
  const arr = [15, 14, 13, 12, 10, 8];
  const keys = ["FOR", "DES", "COS", "INT", "SAG", "CAR"];
  keys.forEach((k, idx) => { state.stats[k] = arr[idx]; });
  recalcMaxHP();
  renderWizard();
}

function roll4d6DropLowestAll() {
  const keys = ["FOR", "DES", "COS", "INT", "SAG", "CAR"];
  keys.forEach(k => {
    const rolls = [1,2,3,4].map(() => Math.floor(Math.random() * 6) + 1).sort((a,b) => a - b);
    state.stats[k] = rolls[1] + rolls[2] + rolls[3];
  });
  recalcMaxHP();
  renderWizard();
  showDiceToast("4d6 Scarta il Più Basso", "Nuovi punteggi generati per tutte le 6 caratteristiche!", "🎲");
}

function recalcMaxHP() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const conMod = getMod(state.stats.COS);
  const toughBonus = (state.species === "Umano" && state.originFeat.startsWith("Robusto")) ? 2 * state.level : 0;
  const dwarfBonus = (state.species === "Nano") ? state.level : 0;
  const perLevel = Math.max(1, Math.floor(cls.hd / 2) + 1 + conMod);
  const maxHp = Math.max(1, cls.hd + conMod + ((state.level - 1) * perLevel) + toughBonus + dwarfBonus);
  state.hpMax = maxHp;
  state.hpCurrent = maxHp;
}

function applyStarterPack(optIdx) {
  const packData = CLASS_STARTER_PACKS[state.className] || CLASS_STARTER_PACKS["Guerriero"];
  const opt = packData.options[optIdx];
  if (!opt) return;
  state.gold = opt.gold;
  state.weapons = (opt.weaponNames || []).map(wName => {
    const wp = WEAPON_PRESETS.find(x => x.name === wName) || WEAPON_PRESETS[0];
    return { ...wp, magicBonus: 0 };
  });
  state.armorIndex = opt.armorIdx || 0;
  state.hasShield = !!opt.shield;
  state.tools = {};
  (opt.tools || []).forEach(t => { state.tools[t] = true; });
  state.inventory = opt.pack || "";
  state.gearItems = opt.pack
    ? [{ name: opt.pack, qty: 1, category: "Zaino & Dotazione", note: "Dotazione iniziale di classe" }]
    : [];
  renderWizard();
  showDiceToast("Equipaggiamento Impostato", `Dotazione per ${state.className} applicata!`, "🎒");
}

function renderWizard() {
  const steps = ["1. Identità", "2. Specie", "3. Classe BK", "4. Caratter.", "5. Oro & Equip."];
  const pillsHtml = steps.map((s, idx) => {
    const num = idx + 1;
    const cls = num === wizStep ? "active" : (num < wizStep ? "done" : "");
    return `<div class="wiz-step-pill ${cls}">${s}</div>`;
  }).join("");

  let bodyHtml = "";
  if (wizStep === 1) {
    bodyHtml = `
      <div style="margin-bottom:8px;"><label class="lbl">Nome del Personaggio</label><input type="text" value="${esc(state.name)}" oninput="state.name=this.value;"></div>
      <div style="display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:8px;">
        <div><label class="lbl">Livello Iniziale (Cap. 1-2 = Liv. 3, o Liv. 1)</label><input type="number" min="1" max="20" value="${state.level}" onchange="state.level=Math.max(1,Math.min(20,Number(this.value)));recalcMaxHP();renderWizard();"></div>
        <div><label class="lbl">Pool Oro (MO)</label><input type="number" min="0" value="${state.gold}" onchange="state.gold=Math.max(0,Number(this.value));"></div>
      </div>
      <div><label class="lbl">Descrivi il tuo Personaggio (chi sei, cosa vuoi, come combatti)</label><textarea rows="3" oninput="state.description=this.value;">${esc(state.description)}</textarea></div>
    `;
  } else if (wizStep === 2) {
    const sp = SPECIES_DATA[state.species];
    const spSkillRule = SPECIES_SKILL_RULES[state.species];
    bodyHtml = `
      <div style="margin-bottom:8px;"><label class="lbl">Scegli la Specie</label>
        <select onchange="state.species=this.value;syncWizardSkillProfs();recalcMaxHP();renderWizard();">
          ${Object.keys(SPECIES_DATA).map(s => `<option value="${s}" ${state.species === s ? "selected" : ""}>${s} (Velocità ${SPECIES_DATA[s].speed} m, Taglia ${SPECIES_DATA[s].size})</option>`).join("")}
        </select>
      </div>
      <div style="background:var(--bk-cream);padding:8px;border-radius:8px;border:1px solid var(--bk-border);margin-bottom:8px;">
        ${sp.traits.map(t => `<div style="margin-bottom:4px;font-size:12px;"><strong>• ${esc(t.name)}:</strong> ${esc(t.desc)}</div>`).join("")}
      </div>
      ${spSkillRule ? `
        <div style="background:#FFFDF5;padding:8px;border-radius:8px;border:1.5px solid var(--bk-gold);margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <label class="lbl" style="margin:0;">🎯 ${esc(spSkillRule.label)}</label>
            <span class="acc-tag">${wizSpeciesSkills.length}/${spSkillRule.count}</span>
          </div>
          <div class="chk-grid">
            ${spSkillRule.pool.map(sid => {
              const skObj = SKILLS_LIST.find(x => x.id === sid);
              const checked = wizSpeciesSkills.includes(sid);
              return `
                <label class="chk-item" style="cursor:pointer;${checked ? "background:#e8f5e9;border:1px solid #2e7d32;font-weight:800;" : ""}">
                  <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleWizSpeciesSkill('${sid}')">
                  <span>${esc(skObj ? skObj.name : sid)} (${skObj ? skObj.stat : ""})</span>
                </label>
              `;
            }).join("")}
          </div>
        </div>
      ` : ""}
      ${state.species === "Umano" ? `
        <div><label class="lbl">Talento d'Origine (Umano Versatile)</label>
          <select onchange="state.originFeat=this.value;recalcMaxHP();renderWizard();">
            ${ORIGIN_FEATS.map(of => `<option value="${esc(of)}" ${state.originFeat === of ? "selected" : ""}>${esc(of)}</option>`).join("")}
          </select>
        </div>
      ` : ""}
    `;
  } else if (wizStep === 3) {
    const cls = CLASSES_DATA[state.className];
    const clsSkillRule = CLASS_SKILL_RULES[state.className];
    bodyHtml = `
      <div style="margin-bottom:8px;"><label class="lbl">Scegli la Classe e Sottoclasse Burger King-Dom</label>
        <select onchange="state.className=this.value;const nc=CLASSES_DATA[this.value];state.saveProfs={};nc.saves.forEach(sv=>state.saveProfs[sv]=true);syncWizardSkillProfs();recalcMaxHP();renderWizard();">
          ${Object.keys(CLASSES_DATA).map(c => `<option value="${c}" ${state.className === c ? "selected" : ""}>${c} — ${CLASSES_DATA[c].subName} (DV d${CLASSES_DATA[c].hd})</option>`).join("")}
        </select>
      </div>
      ${state.className === "Paladino" ? `
        <div style="margin-bottom:8px;"><label class="lbl">Scuola del Burger Knight</label>
          <select onchange="state.paladinSchool=this.value;">
            <option value="Shake-a-Lot" ${state.paladinSchool === "Shake-a-Lot" ? "selected" : ""}>Shake-a-Lot (Gelo & Difesa)</option>
            <option value="King's Blade" ${state.paladinSchool === "King's Blade" ? "selected" : ""}>King's Blade (Fiamme & Assalto)</option>
          </select>
        </div>
      ` : ""}
      ${clsSkillRule ? `
        <div style="background:#FFFDF5;padding:8px;border-radius:8px;border:1.5px solid var(--bk-gold);margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <label class="lbl" style="margin:0;">🎯 ${esc(clsSkillRule.label)}</label>
            <span class="acc-tag">${wizClassSkills.length}/${clsSkillRule.count}</span>
          </div>
          <div class="chk-grid">
            ${clsSkillRule.pool.map(sid => {
              const skObj = SKILLS_LIST.find(x => x.id === sid);
              const fromSpecies = wizSpeciesSkills.includes(sid);
              const isSelected = wizClassSkills.includes(sid);
              const checked = fromSpecies || isSelected;
              const limitReached = !checked && wizClassSkills.length >= clsSkillRule.count;
              const isDisabled = fromSpecies || limitReached;
              return `
                <label class="chk-item" style="cursor:${isDisabled ? "not-allowed" : "pointer"};opacity:${limitReached ? "0.55" : "1"};${checked ? "background:#e8f5e9;border:1px solid #2e7d32;font-weight:800;" : ""}">
                  <input type="checkbox" ${checked ? "checked" : ""} ${isDisabled ? "disabled" : ""} onchange="toggleWizClassSkill('${sid}')">
                  <span>${esc(skObj ? skObj.name : sid)} ${fromSpecies ? "(Specie)" : "(" + (skObj ? skObj.stat : "") + ")"}</span>
                </label>
              `;
            }).join("")}
          </div>
        </div>
      ` : ""}
      <div style="background:var(--bk-cream);padding:8px;border-radius:8px;border:1px solid var(--bk-border);">
        <div style="font-size:12px;font-weight:800;margin-bottom:4px;">Privilegi di ${esc(cls.subName)}:</div>
        ${cls.features.map(f => `<div style="font-size:12px;margin-bottom:4px;"><strong>• (${f.lvl}°) ${esc(f.name)}:</strong> ${esc(f.short)}</div>`).join("")}
      </div>
    `;
  } else if (wizStep === 4) {
    bodyHtml = `
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
        <button class="btn btn-util" style="color:var(--bk-brown);border-color:var(--bk-border);background:var(--bk-cream);" onclick="applyStandardArray()">📊 Array Standard (15,14,13,12,10,8)</button>
        <button class="btn btn-util" style="color:var(--bk-brown);border-color:var(--bk-border);background:var(--bk-cream);" onclick="roll4d6DropLowestAll()">🎲 Tira 4d6 (Scarta Minore)</button>
      </div>
      <div class="stats-grid">
        ${Object.keys(state.stats).map(k => `
          <div class="stat-card">
            <div class="vital-lbl">${k}</div>
            <div class="stat-mod" style="cursor:default;">${fmtMod(getMod(state.stats[k]))}</div>
            <input type="number" min="1" max="30" style="text-align:center;font-weight:800;" value="${state.stats[k]}" onchange="state.stats['${k}']=Number(this.value);recalcMaxHP();renderWizard();">
          </div>
        `).join("")}
      </div>
      <div style="margin-top:8px;font-size:12px;color:#5c3d30;"><strong>PF Massimi Calcolati:</strong> ${state.hpMax} PF</div>
    `;
  } else {
    const packData = CLASS_STARTER_PACKS[state.className] || CLASS_STARTER_PACKS["Guerriero"];
    bodyHtml = `
      <div style="background:var(--bk-cream);padding:8px;border-radius:8px;border:1px solid var(--bk-border);margin-bottom:8px;font-size:12px;">
        <strong>📜 Scelte Iniziali (${esc(state.className)}):</strong> ${esc(packData.summary)}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
        ${packData.options.map((op, idx) => `
          <button class="btn btn-util" style="justify-content:space-between;text-align:left;color:var(--bk-ink);background:#fff;border:1.5px solid var(--bk-border);padding:8px 10px;" onclick="applyStarterPack(${idx})">
            <span>${esc(op.label)}</span>
            <span class="acc-tag">Scegli</span>
          </button>
        `).join("")}
      </div>
      <div style="display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:start;">
        <div>
          <label class="lbl">🪙 Oro (MO)</label>
          <input type="number" min="0" value="${state.gold}" onchange="state.gold=Math.max(0,Number(this.value));renderWizard();">
        </div>
        <div>
          <label class="lbl">🎒 Zaino & Contenuto</label>
          <textarea rows="3" oninput="state.inventory=this.value;">${esc(state.inventory)}</textarea>
        </div>
      </div>
    `;
  }

  document.getElementById("wizard-content").innerHTML = `
    <div class="card-title"><span>🧙‍♂️ Creazione Guidata Personaggio BK 5.5e</span><button class="btn btn-danger" onclick="closeWizard()">✕ Chiudi</button></div>
    <div class="wizard-steps">${pillsHtml}</div>
    ${bodyHtml}
    <div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1.5px solid var(--bk-border);">
      <button class="btn btn-util" style="color:var(--bk-brown);border-color:var(--bk-border);background:var(--bk-cream);" ${wizStep === 1 ? "disabled" : ""} onclick="wizStep--;renderWizard();">← Indietro</button>
      ${wizStep < 5
        ? `<button class="btn btn-print" onclick="wizStep++;renderWizard();">Avanti →</button>`
        : `<button class="btn btn-print" style="background:var(--bk-green);" onclick="autoLoadSubclassSpells();closeWizard();">✓ Completa Scheda</button>`
      }
    </div>
  `;
}

function resetCharacter() {
  if (confirm("Vuoi creare un nuovo personaggio? I dati attuali non esportati verranno azzerati.")) {
    state = defaultState();
    scheduleSave();
    renderApp();
  }
}

saveNow();
