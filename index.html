    description: ""
  };
  applyWizardClassDefaults();
  document.getElementById("wizard-modal").classList.add("open");
  renderWizard();
}

function closeWizard() {
  document.getElementById("wizard-modal").classList.remove("open");
}

function applyWizardClassDefaults() {
  wizDraft.skillProfs = {};
  (CLASS_RECOMMENDED_SKILLS[wizDraft.className] || []).forEach(sk => { wizDraft.skillProfs[sk] = 1; });
  const prio = {
    "Guerriero": ["FOR", "COS", "DES", "SAG", "INT", "CAR"],
    "Ladro": ["DES", "INT", "COS", "SAG", "CAR", "FOR"],
    "Paladino": ["FOR", "CAR", "COS", "SAG", "DES", "INT"],
    "Bardo": ["CAR", "DES", "COS", "SAG", "INT", "FOR"],
    "Mago": ["INT", "COS", "DES", "SAG", "CAR", "FOR"],
    "Druido": ["SAG", "COS", "DES", "INT", "CAR", "FOR"],
    "Chierico": ["SAG", "COS", "FOR", "CAR", "INT", "DES"],
    "Warlock": ["CAR", "COS", "DES", "SAG", "INT", "FOR"]
  }[wizDraft.className] || ["FOR", "DES", "COS", "INT", "SAG", "CAR"];

  if (wizDraft.statMethod === "standard") {
    prio.forEach((st, idx) => { wizDraft.baseStats[st] = STANDARD_ARRAY[idx]; });
  }
  wizDraft.bgPlus2 = prio[0];
  wizDraft.bgPlus1 = prio[1];
}

function getWizardFinalStats() {
  const out = {};
  Object.keys(wizDraft.baseStats).forEach(k => {
    let v = Number(wizDraft.baseStats[k] || 10);
    if (k === wizDraft.bgPlus2) v += 2;
    if (k === wizDraft.bgPlus1 && wizDraft.bgPlus1 !== wizDraft.bgPlus2) v += 1;
    out[k] = Math.min(20, v);
  });
  return out;
}

function getPointBuySpent() {
  return Object.values(wizDraft.baseStats).reduce((acc, v) => acc + (POINT_BUY_COST[v] ?? 0), 0);
}

function finishWizard() {
  const fresh = defaultState();
  const cls = CLASSES_DATA[wizDraft.className] || CLASSES_DATA["Guerriero"];
  const finalStats = getWizardFinalStats();
  const lvl = Math.max(1, Math.min(20, Number(wizDraft.level || 1)));
  const conMod = getMod(finalStats.COS);
  const perLvlHP = Math.max(1, Math.floor(cls.hd / 2) + 1 + conMod);
  let calcHP = Math.max(1, cls.hd + conMod) + (lvl - 1) * perLvlHP;
  if (wizDraft.species === "Nano") calcHP += lvl;
  if (wizDraft.species === "Umano" && wizDraft.originFeat.startsWith("Robusto")) calcHP += 2 * lvl;

  fresh.name = (wizDraft.name || "").trim() || "Eroe della Griglia";
  fresh.species = wizDraft.species;
  fresh.className = wizDraft.className;
  fresh.level = lvl;
  fresh.originFeat = wizDraft.originFeat;
  fresh.paladinSchool = wizDraft.paladinSchool;
  fresh.stats = finalStats;
  fresh.saveProfs = { FOR: false, DES: false, COS: false, INT: false, SAG: false, CAR: false };
  cls.saves.forEach(s => { fresh.saveProfs[s] = true; });
  fresh.skillProfs = { ...wizDraft.skillProfs };
  fresh.hpMax = calcHP;
  fresh.hpCurrent = calcHP;
  fresh.description = wizDraft.description || "";
  if (wizDraft.species === "Umano") fresh.inspiration = true;

  if (wizDraft.useStarterPack) {
    const pack = CLASS_STARTER_PACKS[wizDraft.className];
    if (pack) {
      fresh.armorIndex = pack.armorIndex;
      fresh.hasShield = pack.hasShield;
      fresh.gold = pack.gold;
      fresh.weapons = pack.weapons.map(wn => {
        const found = WEAPON_PRESETS.find(wp => wp.name === wn);
        return found ? { ...found, magicBonus: 0 } : null;
      }).filter(Boolean);
      pack.tools.forEach(t => { fresh.tools[t] = true; });
      const packGear = pack.gear || [];
      fresh.backpacks = packGear
        .filter(g => g.category === "Zaino & Dotazione")
        .map(g => ({ name: g.name, open: true, items: parsePackNoteToSubItems(g.note) }));
      fresh.gearItems = normalizeGearItemsList(packGear.filter(g => g.category !== "Zaino & Dotazione"));
      Object.assign(fresh.burgerPantry, pack.burgers || {});
    }
  }

  state = fresh;
  syncInventoryTextFromGear();
  if (CLASSES_DATA[state.className]?.caster) {
    const std = getStandardSlotsForChar();
    [1,2,3,4,5].forEach(l => { state.spellSlots[l] = { max: std[l] || 0, used: 0 }; });
  }
  saveNow();
  closeWizard();
  currentTab = "home";
  renderApp();
  showDiceToast("Personaggio Creato!", `${state.name} (${state.species} ${state.className} Liv. ${state.level}) pronto!`, "👑");
}

function renderWizard() {
  const box = document.getElementById("wizard-content");
  const stepNames = ["1. Identità", "2. Caratt.", "3. Abilità", "4. Equip.", "5. Riepilogo"];
  const stepsBar = `<div class="wizard-steps">${stepNames.map((n, i) => `<div class="wiz-step-pill ${wizStep === i + 1 ? "active" : (wizStep > i + 1 ? "done" : "")}">${n}</div>`).join("")}</div>`;

  let bodyHtml = "";
  if (wizStep === 1) {
    const cls = CLASSES_DATA[wizDraft.className];
    const sp = SPECIES_DATA[wizDraft.species];
    bodyHtml = `
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px;">
        <div><label class="lbl">Nome del Personaggio</label><input type="text" placeholder="Es. Sir Barnaby della Griglia" value="${esc(wizDraft.name)}" oninput="wizDraft.name=this.value"></div>
        <div><label class="lbl">Livello Iniziale</label><input type="number" min="1" max="20" value="${wizDraft.level}" onchange="wizDraft.level=Math.max(1,Math.min(20,Number(this.value)));renderWizard();"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
        <div>
          <label class="lbl">Specie</label>
          <select onchange="wizDraft.species=this.value;renderWizard();">
            ${Object.keys(SPECIES_DATA).map(s => `<option value="${s}" ${wizDraft.species === s ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="lbl">Classe & Sottoclasse BK</label>
          <select onchange="wizDraft.className=this.value;applyWizardClassDefaults();renderWizard();">
            ${Object.keys(CLASSES_DATA).map(c => `<option value="${c}" ${wizDraft.className === c ? "selected" : ""}>${c} (${CLASSES_DATA[c].subName})</option>`).join("")}
          </select>
        </div>
      </div>
      ${wizDraft.species === "Umano" ? `
        <div style="margin-bottom:8px;">
          <label class="lbl">Talento d'Origine 5.5e (Umano Versatile)</label>
          <select onchange="wizDraft.originFeat=this.value;renderWizard();">
            ${ORIGIN_FEATS.map(of => `<option value="${esc(of)}" ${wizDraft.originFeat === of ? "selected" : ""}>${esc(of)}</option>`).join("")}
          </select>
        </div>
      ` : ""}
      ${wizDraft.className === "Paladino" ? `
        <div style="margin-bottom:8px;">
          <label class="lbl">Scuola dell'Ordine Reale (Paladino)</label>
          <select onchange="wizDraft.paladinSchool=this.value;">
            <option value="Shake-a-Lot" ${wizDraft.paladinSchool === "Shake-a-Lot" ? "selected" : ""}>Scuola Shake-a-Lot (Gelo & Difesa)</option>
            <option value="King's Blade" ${wizDraft.paladinSchool === "King's Blade" ? "selected" : ""}>Scuola King's Blade (Fiamme & Assalto)</option>
          </select>
        </div>
      ` : ""}
      <div class="card" style="background:var(--bk-cream);margin-bottom:0;">
        <div style="font-size:12px;margin-bottom:4px;"><strong>🧬 ${wizDraft.species}:</strong> ${sp.traits.map(t => t.name).join(" • ")}</div>
        <div style="font-size:12px;"><strong>⚔️ ${wizDraft.className} (d${cls.hd}):</strong> TS in ${cls.saves.join(" e ")} • Sottoclasse <em>${cls.subName}</em></div>
      </div>
    `;
  } else if (wizStep === 2) {
    const finalStats = getWizardFinalStats();
    const spent = getPointBuySpent();
    const statKeys = ["FOR", "DES", "COS", "INT", "SAG", "CAR"];
    bodyHtml = `
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
        <div class="adv-group">
          <button class="adv-btn ${wizDraft.statMethod === "standard" ? "active-norm" : ""}" onclick="wizDraft.statMethod='standard';applyWizardClassDefaults();renderWizard();">Serie Standard (15,14,13,12,10,8)</button>
          <button class="adv-btn ${wizDraft.statMethod === "pointbuy" ? "active-norm" : ""}" onclick="wizDraft.statMethod='pointbuy';statKeys=[10,10,10,10,10,10];Object.keys(wizDraft.baseStats).forEach(k=>wizDraft.baseStats[k]=10);renderWizard();">Point Buy (27 pt)</button>
        </div>
        ${wizDraft.statMethod === "pointbuy" ? `<span class="acc-tag" style="background:${spent <= 27 ? "var(--bk-green)" : "var(--bk-red)"};">Punti usati: ${spent} / 27</span>` : ""}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;background:#FFF8E1;padding:7px;border-radius:8px;border:1px solid var(--bk-gold);">
        <div><label class="lbl">Bonus Origine +2</label><select onchange="wizDraft.bgPlus2=this.value;renderWizard();">${statKeys.map(k => `<option value="${k}" ${wizDraft.bgPlus2 === k ? "selected" : ""}>+2 ${k}</option>`).join("")}</select></div>
        <div><label class="lbl">Bonus Origine +1</label><select onchange="wizDraft.bgPlus1=this.value;renderWizard();">${statKeys.map(k => `<option value="${k}" ${wizDraft.bgPlus1 === k ? "selected" : ""}>+1 ${k}</option>`).join("")}</select></div>
      </div>
      <div class="stats-grid">
        ${statKeys.map(k => {
          const baseV = wizDraft.baseStats[k];
          const finV = finalStats[k];
          return `
            <div class="stat-card">
              <div class="vital-lbl">${k}</div>
              <div style="font-size:18px;font-weight:900;color:var(--bk-red);">${finV} (${fmtMod(getMod(finV))})</div>
              ${wizDraft.statMethod === "standard"
                ? `<select style="margin-top:4px;padding:3px;" onchange="const nv=Number(this.value);const other=Object.keys(wizDraft.baseStats).find(x=>x!=='${k}'&&wizDraft.baseStats[x]===nv);if(other)wizDraft.baseStats[other]=wizDraft.baseStats['${k}'];wizDraft.baseStats['${k}']=nv;renderWizard();">
                    ${STANDARD_ARRAY.map(n => `<option value="${n}" ${baseV === n ? "selected" : ""}>Base ${n}</option>`).join("")}
                   </select>`
                : `<div style="display:flex;justify-content:center;gap:4px;margin-top:4px;">
                    <button class="roll-pill" style="padding:1px 6px;" onclick="wizDraft.baseStats['${k}']=Math.max(8,wizDraft.baseStats['${k}']-1);renderWizard();">-</button>
                    <strong>${baseV}</strong>
                    <button class="roll-pill" style="padding:1px 6px;" onclick="wizDraft.baseStats['${k}']=Math.min(15,wizDraft.baseStats['${k}']+1);renderWizard();">+</button>
                   </div>`
              }
            </div>
          `;
        }).join("")}
      </div>
    `;
  } else if (wizStep === 3) {
    const finalStats = getWizardFinalStats();
    const pb = Math.floor((wizDraft.level - 1) / 4) + 2;
    bodyHtml = `
      <div style="font-size:12px;margin-bottom:8px;color:#5c3d30;">Seleziona le competenze nelle abilità (pre-selezionate quelle consigliate per <strong>${wizDraft.className}</strong>):</div>
      <div style="max-height:280px;overflow-y:auto;border:1px solid var(--bk-border);border-radius:8px;background:#fff;">
        ${SKILLS_LIST.map(sk => {
          const p = Number(wizDraft.skillProfs[sk.id] || 0);
          const tot = getMod(finalStats[sk.stat]) + p * pb;
          return `
            <div class="skill-row">
              <div style="display:flex;align-items:center;">
                <button class="prof-dot ${p === 1 ? "p1" : (p === 2 ? "p2" : "")}" onclick="wizDraft.skillProfs['${sk.id}']=(Number(wizDraft.skillProfs['${sk.id}']||0)+1)%3;renderWizard();">${p === 2 ? "2×" : (p === 1 ? "✓" : "")}</button>
                <span><strong>${sk.name}</strong> (${sk.stat})</span>
              </div>
              <span style="font-weight:800;">${fmtMod(tot)}</span>
            </div>
          `;
        }).join("")}
      </div>
    `;
  } else if (wizStep === 4) {
    const pack = CLASS_STARTER_PACKS[wizDraft.className];
    bodyHtml = `
      <label class="chk-item" style="padding:10px;border:1.5px solid var(--bk-gold);background:#FFF8E1;margin-bottom:8px;cursor:pointer;">
        <input type="checkbox" ${wizDraft.useStarterPack ? "checked" : ""} onchange="wizDraft.useStarterPack=this.checked;renderWizard();">
        <div>
          <strong>Includi Pacchetto Equipaggiamento Iniziale (${wizDraft.className})</strong>
          <div style="font-size:11.5px;color:#5c3d30;">
            Armatura: ${ARMOR_PRESETS[pack.armorIndex].name}${pack.hasShield ? " + Scudo" : ""} • Armi: ${pack.weapons.join(", ")} • ${pack.gold} MO + 1 Panino BK
          </div>
        </div>
      </label>
      <label class="lbl">Background / Tratti del Personaggio (opzionale)</label>
      <textarea rows="4" placeholder="Racconta brevemente chi è il tuo personaggio, il suo piatto preferito e perché viaggia..." oninput="wizDraft.description=this.value">${esc(wizDraft.description)}</textarea>
    `;
  } else if (wizStep === 5) {
    const finalStats = getWizardFinalStats();
    const cls = CLASSES_DATA[wizDraft.className];
    const conMod = getMod(finalStats.COS);
    const perLvlHP = Math.max(1, Math.floor(cls.hd / 2) + 1 + conMod);
    let calcHP = Math.max(1, cls.hd + conMod) + (wizDraft.level - 1) * perLvlHP;
    if (wizDraft.species === "Nano") calcHP += wizDraft.level;
    if (wizDraft.species === "Umano" && wizDraft.originFeat.startsWith("Robusto")) calcHP += 2 * wizDraft.level;

    bodyHtml = `
      <div class="card" style="background:var(--bk-cream);margin-bottom:0;">
        <h3 style="font-size:16px;color:var(--bk-brown);margin-bottom:6px;">👑 ${esc(wizDraft.name || "Eroe della Griglia")}</h3>
        <div style="font-size:12.5px;margin-bottom:6px;">
          <strong>Specie & Classe:</strong> ${wizDraft.species} • ${wizDraft.className} (${cls.subName}) — Livello ${wizDraft.level}<br>
          <strong>Punti Ferita Massimi Calcolati:</strong> ${calcHP} PF (Dado Vita d${cls.hd})<br>
          <strong>Caratteristiche Finali:</strong> ${Object.keys(finalStats).map(k => `${k} ${finalStats[k]} (${fmtMod(getMod(finalStats[k]))})`).join(" • ")}
        </div>
        <div style="font-size:11.5px;color:#7a3b26;">Cliccando su "Crea Scheda" sostituirai la scheda corrente con questo nuovo personaggio.</div>
      </div>
    `;
  }

  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong style="font-size:15px;color:var(--bk-brown);">🧙‍♂️ Creazione Guidata Personaggio 5.5e</strong>
      <button class="btn btn-util" style="color:var(--bk-brown);border-color:var(--bk-border);" onclick="closeWizard()">✕ Chiudi</button>
    </div>
    ${stepsBar}
    ${bodyHtml}
    <div style="display:flex;justify-content:space-between;margin-top:12px;">
      <button class="btn btn-util" style="color:var(--bk-brown);border-color:var(--bk-border);" ${wizStep === 1 ? "disabled" : ""} onclick="wizStep--;renderWizard();">← Indietro</button>
      ${wizStep < 5
        ? `<button class="btn btn-print" onclick="wizStep++;renderWizard();">Avanti →</button>`
        : `<button class="btn btn-print" style="background:var(--bk-green);" onclick="finishWizard()">✓ Crea Scheda</button>`
      }
    </div>
  `;
}

renderApp();
idbRestoreIfNeeded();
</script>
</body>
</html>
