<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Burger King's Quest — Scheda Personaggio D&D 5.5e (v24)</title>
<meta name="theme-color" content="#502314">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BK Quest 5.5e">
<meta name="mobile-web-app-capable" content="yes">
<link id="pwa-icon" rel="icon" type="image/png">
<link id="pwa-apple-icon" rel="apple-touch-icon">
<link id="pwa-manifest" rel="manifest">
<script>
(function() {
  try {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#502314';
    ctx.beginPath();
    ctx.roundRect(0, 0, 512, 512, 110);
    ctx.fill();
    ctx.strokeStyle = '#FF8732';
    ctx.lineWidth = 22;
    ctx.stroke();

    ctx.fillStyle = '#F5A623';
    ctx.beginPath();
    ctx.arc(256, 235, 145, Math.PI, 0, false);
    ctx.fill();

    ctx.fillStyle = '#D62300';
    ctx.beginPath();
    ctx.roundRect(102, 248, 308, 44, 22);
    ctx.fill();

    ctx.fillStyle = '#F5A623';
    ctx.beginPath();
    ctx.roundRect(111, 306, 290, 46, 20);
    ctx.fill();

    ctx.fillStyle = '#FFFDF9';
    ctx.font = '900 54px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BK QUEST', 256, 422);

    const iconUrl = c.toDataURL('image/png');
    document.getElementById('pwa-icon').href = iconUrl;
    document.getElementById('pwa-apple-icon').href = iconUrl;

    const manifest = {
      name: "Burger King's Quest — Scheda D&D 5.5e",
      short_name: "BK Quest 5.5e",
      description: "Scheda personaggio interattiva D&D 5.5e per Burger King's Quest",
      start_url: window.location.href.split('#')[0],
      display: "standalone",
      background_color: "#FBF6EE",
      theme_color: "#502314",
      orientation: "portrait",
      icons: [
        { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
  } catch (e) {}
})();
</script>

<style>
  :root {
    --bk-red: #D62300;
    --bk-red-dark: #9B1800;
    --bk-orange: #FF8732;
    --bk-gold: #F5A623;
    --bk-cream: #FBF6EE;
    --bk-paper: #FFFDF9;
    --bk-brown: #502314;
    --bk-brown-light: #7A3B26;
    --bk-green: #198754;
    --bk-border: #E5D5C3;
    --bk-ink: #24130D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { overscroll-behavior-y: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bk-cream);
    color: var(--bk-ink);
    line-height: 1.4;
    padding-bottom: 44px;
  }

  /* TOP BAR */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bk-brown);
    color: #fff;
    border-bottom: 3px solid var(--bk-orange);
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  .topbar-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 8px 10px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .brand-badge {
    background: var(--bk-red);
    color: #fff;
    font-weight: 900;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 999px;
    border: 1.5px solid var(--bk-gold);
    letter-spacing: 0.4px;
  }
  .brand-title h1 {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.3px;
    color: #FFFDF9;
  }
  .save-pill {
    font-size: 11px;
    background: rgba(25, 135, 84, 0.25);
    border: 1px solid #3dd598;
    color: #a3f7d4;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
  }

  .actions-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .btn {
    border: none;
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-lock { background: #3A2218; color: #F5A623; border: 1px solid #F5A623; }
  .btn-lock.unlocked { background: #F5A623; color: #24130D; }
  .btn-print { background: var(--bk-red); color: #fff; }
  .btn-util { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .btn-danger { background: rgba(214,35,0,0.25); color: #ffb3a6; border: 1px solid rgba(214,35,0,0.5); }

  /* 7-TAB GRID NAVIGATION */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    background: rgba(0,0,0,0.25);
    padding: 4px;
    border-radius: 10px;
  }
  .nav-tab {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.75);
    padding: 6px 2px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 9.5px;
    font-weight: 700;
    transition: all 0.15s ease;
  }
  .nav-tab .ico { font-size: 14px; line-height: 1; }
  .nav-tab.active {
    background: var(--bk-cream);
    color: var(--bk-brown);
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  }

  /* ADVANTAGE / DISADVANTAGE & ROLL LOG BAR */
  .roll-mode-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
    background: var(--bk-paper);
    border: 1.5px solid var(--bk-border);
    border-radius: 10px;
    padding: 6px 9px;
    margin-bottom: 10px;
  }
  .adv-group {
    display: inline-flex;
    background: var(--bk-cream);
    border: 1px solid var(--bk-border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .adv-btn {
    border: none;
    background: transparent;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    color: var(--bk-brown);
    cursor: pointer;
  }
  .adv-btn.active-norm { background: var(--bk-brown); color: #fff; }
  .adv-btn.active-adv { background: var(--bk-green); color: #fff; }
  .adv-btn.active-dis { background: var(--bk-red); color: #fff; }

  /* MODALS (WIZARD & ROLL LOG) */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9500;
    background: rgba(24, 10, 5, 0.78);
    padding: 12px;
    overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }
  .wizard-box {
    background: var(--bk-paper);
    border: 2.5px solid var(--bk-gold);
    border-radius: 14px;
    width: 100%;
    max-width: 720px;
    padding: 14px;
    margin: 12px auto;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  .wizard-steps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .wiz-step-pill {
    font-size: 10px;
    font-weight: 800;
    text-align: center;
    padding: 5px 3px;
    border-radius: 6px;
    background: var(--bk-cream);
    color: #7a3b26;
    border: 1px solid var(--bk-border);
  }
  .wiz-step-pill.active { background: var(--bk-red); color: #fff; border-color: var(--bk-red); }
  .wiz-step-pill.done { background: #e8f5e9; color: #1b5e20; border-color: #2e7d32; }
  .search-box-row { margin-bottom: 8px; }

  /* DICE TOAST POPUP */
  #dice-toast {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translate(-50%, -130%);
    z-index: 9999;
    background: var(--bk-brown);
    color: #fff;
    border: 2px solid var(--bk-gold);
    border-radius: 14px;
    padding: 10px 16px;
    min-width: 260px;
    max-width: 92vw;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
  }
  #dice-toast.show { transform: translate(-50%, 0); }
  #dice-toast.crit { border-color: #2ecc71; background: #153b24; }
  #dice-toast.fumble { border-color: #ff4d4d; background: #4a1212; }
  .toast-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--bk-gold); font-weight: 800; }
  .toast-detail { font-size: 12px; color: #f1e6db; margin-top: 2px; }
  .toast-total { font-size: 24px; font-weight: 900; color: #fff; background: var(--bk-red); padding: 4px 12px; border-radius: 10px; border: 1.5px solid var(--bk-gold); }

  /* CONTAINER & CARDS */
  .container { max-width: 960px; margin: 10px auto; padding: 0 10px; }
  .card {
    background: var(--bk-paper);
    border: 1.5px solid var(--bk-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 11px;
    box-shadow: 0 2px 6px rgba(80,35,20,0.05);
  }
  .card-title {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--bk-brown);
    border-bottom: 2px solid var(--bk-border);
    padding-bottom: 6px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* FORM CONTROLS */
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1.5px solid var(--bk-border);
    border-radius: 8px;
    background: #fff;
    color: var(--bk-ink);
    font-size: 13px;
    font-family: inherit;
  }
  input:disabled, select:disabled, textarea:disabled {
    background: #F6EFE6;
    color: var(--bk-ink);
    border-color: transparent;
    font-weight: 600;
    opacity: 1;
  }
  label.lbl {
    display: block;
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--bk-brown-light);
    margin-bottom: 3px;
  }

  /* HERO HEADER & PORTRAIT */
  .hero-grid {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 12px;
    align-items: center;
  }
  .hero-fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .hero-row-top { display: grid; grid-template-columns: minmax(0, 1fr) 74px; gap: 8px; align-items: end; }
  .hero-row-bot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: end; }
  .hero-fields input, .hero-fields select { height: 36px; width: 100%; min-width: 0; }
  .portrait-box {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 3px solid var(--bk-red);
    background: #F3E6D8;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    flex-shrink: 0;
  }
  .portrait-box img { width: 100%; height: 100%; object-fit: cover; }
  .portrait-placeholder { font-size: 36px; }
  .portrait-upload {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(36,19,13,0.8);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    padding: 3px 0;
    cursor: pointer;
  }

  /* VITALS & STAT PILLS */
  .vitals-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  @media (min-width: 640px) {
    .vitals-grid { grid-template-columns: repeat(6, 1fr); }
  }
  .vital-box {
    background: var(--bk-cream);
    border: 1.5px solid var(--bk-border);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    min-height: 74px;
  }
  .vital-box.insp-active {
    background: linear-gradient(135deg, #FFF8E1 0%, #FFE082 100%);
    border: 2px solid #F5A623;
    box-shadow: 0 2px 8px rgba(245, 166, 35, 0.3);
  }
  .vital-box.insp-active .vital-val { color: #B26A00; }
  .vital-box.clickable { cursor: pointer; }
  .vital-box.clickable:hover { border-color: var(--bk-red); }
  .vital-lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--bk-brown-light); }
  .vital-val { font-size: 20px; font-weight: 900; color: var(--bk-brown); line-height: 1.15; margin-top: 2px; }
  .vital-sub { font-size: 10px; color: #7c6558; }

  /* CONDITION CHIPS */
  .cond-chips {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--bk-border);
  }
  .cond-chip {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--bk-border);
    background: var(--bk-cream);
    color: var(--bk-brown);
    cursor: pointer;
    user-select: none;
  }
  .cond-chip.on {
    background: var(--bk-red);
    color: #fff;
    border-color: var(--bk-red-dark);
  }
  .cond-chip.conc-on {
    background: #0d6efd;
    color: #fff;
    border-color: #0a58ca;
  }

  /* HP BAR */
  .hp-panel {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    background: #FFF5F2;
    border: 1.5px solid #F3C4B8;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .hp-controls { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .rest-stack { display: flex; flex-direction: column; gap: 4px; }
  .rest-stack .hp-btn { padding: 4px 8px; font-size: 11px; white-space: nowrap; }
  .hp-btn {
    padding: 5px 9px;
    border-radius: 6px;
    border: none;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
  }
  .hp-dmg { background: var(--bk-red); color: #fff; }
  .hp-heal { background: var(--bk-green); color: #fff; }
  .hp-rest { background: var(--bk-brown); color: #fff; }

  /* ABILITY SCORES */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  @media (min-width: 640px) {
    .stats-grid { grid-template-columns: repeat(6, 1fr); }
  }
  .stat-card {
    background: var(--bk-cream);
    border: 1.5px solid var(--bk-border);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat-mod {
    font-size: 22px;
    font-weight: 900;
    color: var(--bk-red);
    cursor: pointer;
    padding: 2px 0;
  }
  .stat-save-row {
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed var(--bk-border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
  }

  /* SKILLS & COMPACT INVENTORY TABLE */
  .skill-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px solid #F0E6DA;
    font-size: 13px;
  }
  .skill-row:last-child { border-bottom: none; }
  .prof-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--bk-brown);
    background: #fff;
    font-size: 10px;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 7px;
  }
  .prof-dot.p1 { background: var(--bk-brown); color: #fff; }
  .prof-dot.p2 { background: var(--bk-red); color: var(--bk-gold); border-color: var(--bk-red); }
  .roll-pill {
    background: var(--bk-cream);
    border: 1.5px solid var(--bk-border);
    border-radius: 7px;
    padding: 3px 9px;
    font-weight: 800;
    font-size: 12.5px;
    color: var(--bk-brown);
    cursor: pointer;
  }
  .roll-pill:hover { background: var(--bk-red); color: #fff; border-color: var(--bk-red); }

  /* COMPACT INVENTORY FILTER PILLS & TABLE */
  .inv-filter-bar {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 8px;
  }
  .inv-pill {
    border: 1.5px solid var(--bk-border);
    background: var(--bk-cream);
    color: var(--bk-brown);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
    cursor: pointer;
  }
  .inv-pill.active {
    background: var(--bk-brown);
    color: #fff;
    border-color: var(--bk-brown);
  }
  .inv-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .inv-table th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--bk-brown-light);
    background: var(--bk-cream);
    padding: 6px 7px;
    border-bottom: 1.5px solid var(--bk-border);
  }
  .inv-table td {
    padding: 7px;
    border-bottom: 1px solid #F0E6DA;
    vertical-align: middle;
  }
  .inv-table tr:last-child td { border-bottom: none; }
  .cat-badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 4px;
    background: #EFE4D6;
    color: var(--bk-brown);
  }

  /* ACCORDION ITEMS */
  .acc-item {
    border: 1.5px solid var(--bk-border);
    border-radius: 9px;
    margin-bottom: 6px;
    background: #fff;
    overflow: hidden;
  }
  .acc-head {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    background: var(--bk-cream);
  }
  .acc-title { font-weight: 800; font-size: 13px; color: var(--bk-ink); }
  .acc-tag {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--bk-brown);
    color: #fff;
    white-space: nowrap;
  }
  .acc-body {
    display: none;
    padding: 9px 11px;
    font-size: 12.5px;
    color: #3d2820;
    border-top: 1px solid var(--bk-border);
    background: #FFFDF9;
  }
  .acc-item.open .acc-body { display: block; }

  /* BITE RULE BANNER */
  .bite-banner {
    background: linear-gradient(135deg, #502314 0%, #8C1D04 100%);
    color: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* CHECKBOX GRID */
  .chk-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    font-size: 12px;
  }
  @media (min-width: 640px) {
    .chk-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .chk-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    background: var(--bk-cream);
    border-radius: 6px;
  }

  /* DICE TRAY */
  .dice-btns {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .die-btn {
    background: var(--bk-brown);
    color: #fff;
    border: 2px solid var(--bk-gold);
    border-radius: 10px;
    padding: 11px 6px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
  }

  /* DIARY SUB-TABS & CARDS */
  .diary-subnav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .diary-subbtn {
    background: var(--bk-cream);
    border: 1.5px solid var(--bk-border);
    border-radius: 8px;
    padding: 7px 6px;

function normalizeGearItemsList(rawList) {
  const map = new Map();
  (rawList || []).forEach(g => {
    if (!g) return;
    const rawName = String(g.name || "Oggetto").trim();
    if (!rawName) return;
    const qty = Math.max(1, Number(g.qty || 1));
    const category = String(g.category || "Attrezzatura").trim() || "Attrezzatura";
    const note = String(g.note || "").trim();
    const maxCharges = Math.max(0, Number(g.maxCharges || 0));
    const charges = maxCharges > 0
      ? Math.max(0, Math.min(maxCharges * qty, Number(g.charges !== undefined ? g.charges : maxCharges * qty)))
      : 0;
    const key = `${category.toLowerCase()}::${rawName.toLowerCase()}::${note.toLowerCase()}::${maxCharges}`;
    if (map.has(key)) {
      const ex = map.get(key);
      ex.qty += qty;
      if (maxCharges > 0) ex.charges = Math.min(ex.maxCharges * ex.qty, ex.charges + charges);
    } else {
      map.set(key, { name: rawName, qty, category, note, charges, maxCharges });
    }
  });
  return Array.from(map.values());
}

function migrateState(rawObj) {
  const base = defaultState();
  if (!rawObj || typeof rawObj !== "object") return base;

  const src = (rawObj.data && typeof rawObj.data === "object")
    ? rawObj.data
    : ((rawObj.character && typeof rawObj.character === "object") ? rawObj.character : rawObj);

  const merged = Object.assign({}, base, src);

  merged.stats = Object.assign({}, base.stats, (src.stats && typeof src.stats === "object") ? src.stats : {});
  merged.saveProfs = Object.assign({}, base.saveProfs, (src.saveProfs && typeof src.saveProfs === "object") ? src.saveProfs : {});
  merged.skillProfs = Object.assign({}, base.skillProfs, (src.skillProfs && typeof src.skillProfs === "object") ? src.skillProfs : {});
  merged.conditions = Object.assign({}, base.conditions, (src.conditions && typeof src.conditions === "object") ? src.conditions : {});
  merged.featureUses = Object.assign({}, base.featureUses, (src.featureUses && typeof src.featureUses === "object") ? src.featureUses : {});
  merged.burgerPantry = Object.assign({}, base.burgerPantry, (src.burgerPantry && typeof src.burgerPantry === "object") ? src.burgerPantry : {});
  merged.friesPantry = Object.assign({}, base.friesPantry, (src.friesPantry && typeof src.friesPantry === "object") ? src.friesPantry : {});
  merged.ingredients = Object.assign({}, base.ingredients, (src.ingredients && typeof src.ingredients === "object") ? src.ingredients : {});
  merged.tools = Object.assign({}, base.tools, (src.tools && typeof src.tools === "object") ? src.tools : {});

  const dsSrc = (src.deathSaves && typeof src.deathSaves === "object") ? src.deathSaves : {};
  merged.deathSaves = {
    succ: [0, 1, 2].map(i => Boolean(Array.isArray(dsSrc.succ) ? dsSrc.succ[i] : false)),
    fail: [0, 1, 2].map(i => Boolean(Array.isArray(dsSrc.fail) ? dsSrc.fail[i] : false))
  };

  const slotsSrc = (src.spellSlots && typeof src.spellSlots === "object") ? src.spellSlots : {};
  merged.spellSlots = {};
  [1, 2, 3, 4, 5].forEach(lvl => {
    const s = slotsSrc[lvl] || slotsSrc[String(lvl)] || {};
    const maxVal = Math.max(0, Number(s.max || 0));
    const usedVal = Math.max(0, Math.min(maxVal || 99, Number(s.used || 0)));
    merged.spellSlots[lvl] = { max: maxVal, used: usedVal };
  });

  merged.weapons = Array.isArray(src.weapons)
    ? src.weapons.map(w => Object.assign({ name: "Arma", dice: "1d6", dmgType: "Contundente", stat: "FOR", magicBonus: 0, mastery: "", props: "" }, w || {}))
    : [];

  merged.spells = Array.isArray(src.spells)
    ? src.spells.map(sp => Object.assign({ level: 1, name: "Incantesimo", time: "1 Azione", range: "18 m", prep: true, note: "" }, sp || {}))
    : [];

  merged.magicItems = Array.isArray(src.magicItems)
    ? src.magicItems.map(it => {
        const obj = Object.assign({ name: "Oggetto Magico", active: true, charges: 0, maxCharges: 0, note: "" }, it || {});
        obj.maxCharges = Math.max(0, Number(obj.maxCharges || 0));
        if (obj.maxCharges > 0 && (it.charges === undefined || it.charges === null)) {
          obj.charges = obj.maxCharges;
        } else {
          obj.charges = Math.max(0, Math.min(obj.maxCharges || 99, Number(obj.charges || 0)));
        }
        return obj;
      })
    : [];

  merged.diaryPlaces = Array.isArray(src.diaryPlaces)
    ? src.diaryPlaces.map(p => Object.assign({ name: "Luogo", kind: "Città / Villaggio", status: "Visitato", note: "" }, p || {}))
    : [];

  merged.diaryPeople = Array.isArray(src.diaryPeople)
    ? src.diaryPeople.map(p => Object.assign({ name: "PNG", role: "", attitude: "Neutrale", note: "" }, p || {}))
    : [];

  const rawGear = Array.isArray(src.gearItems)
    ? src.gearItems
    : (src.inventory && String(src.inventory).trim()
        ? [{ name: String(src.inventory).trim(), qty: 1, category: "Attrezzatura", note: "", charges: 0, maxCharges: 0 }]
        : []);
  merged.gearItems = normalizeGearItemsList(rawGear);

  merged.silver = Math.max(0, Number(merged.silver || 0));
  merged.copper = Math.max(0, Number(merged.copper || 0));
  merged.level = Math.max(1, Math.min(20, Number(merged.level || 1)));
  merged.xp = Math.max(0, Number(merged.xp || 0));
  merged.hpMax = Math.max(1, Number(merged.hpMax || 12));
  merged.hpCurrent = Math.max(0, Math.min(merged.hpMax, Number(merged.hpCurrent ?? merged.hpMax)));
  merged.hpTemp = Math.max(0, Number(merged.hpTemp || 0));
  merged.hdUsed = Math.max(0, Math.min(merged.level, Number(merged.hdUsed || 0)));
  merged.exhaustion = Math.max(0, Math.min(6, Number(merged.exhaustion || 0)));
  merged.gold = Number(merged.gold || 0);
  merged.schemaVersion = SCHEMA_VERSION;

  return merged;
}

function encodeHashState(obj) {
  try {
    const copy = Object.assign({}, obj, { portrait: "" });
    const json = JSON.stringify(copy);
    return btoa(unescape(encodeURIComponent(json)));
  } catch (e) { return ""; }
}

function decodeHashState(hashStr) {
  try {
    const clean = String(hashStr || "").replace(/^#s=/, "");
    if (!clean) return null;
    const json = decodeURIComponent(escape(atob(clean)));
    return JSON.parse(json);
  } catch (e) { return null; }
}

function idbSaveState(serialized) {
  try {
    if (!window.indexedDB) return;
    const req = indexedDB.open("bk_quest_idb", 1);
    req.onupgradeneeded = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("sheets")) db.createObjectStore("sheets");
    };
    req.onsuccess = function(e) {
      try {
        const db = e.target.result;
        const tx = db.transaction("sheets", "readwrite");
        tx.objectStore("sheets").put(serialized, STORAGE_KEY);
      } catch (err) {}
    };
  } catch (e) {}
}

function idbRestoreIfNeeded() {
  if (loadedFromStorage) return;
  try {
    if (!window.indexedDB) return;
    const req = indexedDB.open("bk_quest_idb", 1);
    req.onupgradeneeded = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("sheets")) db.createObjectStore("sheets");
    };
    req.onsuccess = function(e) {
      try {
        const db = e.target.result;
        const tx = db.transaction("sheets", "readonly");
        const getReq = tx.objectStore("sheets").get(STORAGE_KEY);
        getReq.onsuccess = function() {
          if (!loadedFromStorage && getReq.result) {
            try {
              const parsed = JSON.parse(getReq.result);
              state = migrateState(parsed);
              loadedFromStorage = true;
              saveNow();
              renderApp();
            } catch (err) {}
          }
        };
      } catch (err) {}
    };
  } catch (e) {}
}

function loadState() {
  try {
    const keysToTry = [STORAGE_KEY, "bk_quest_55e_v2", "bk_quest_55e_v1"];
    for (const k of keysToTry) {
      const raw = localStorage.getItem(k);
      if (raw) {
        const parsed = JSON.parse(raw);
        loadedFromStorage = true;
        return migrateState(parsed);
      }
    }
  } catch (e) {}
  try {
    if (window.location.hash && window.location.hash.startsWith("#s=")) {
      const parsed = decodeHashState(window.location.hash);
      if (parsed) { loadedFromStorage = true; return migrateState(parsed); }
    }
  } catch (e) {}
  try {
    if (typeof window.name === "string" && window.name.startsWith("BK_QUEST_STATE:")) {
      const parsed = JSON.parse(window.name.slice("BK_QUEST_STATE:".length));
      loadedFromStorage = true;
      return migrateState(parsed);
    }
  } catch (e) {}
  return defaultState();
}

let state = loadState();

function saveNow() {
  clearTimeout(saveTimer);
  const pill = document.getElementById("save-status");
  const serialized = JSON.stringify(state);
  let savedLocal = false;
  let savedHash = false;

  try { localStorage.setItem(STORAGE_KEY, serialized); savedLocal = true; loadedFromStorage = true; } catch (e) {}
  try { window.name = "BK_QUEST_STATE:" + serialized; } catch (e) {}
  try {
    const encoded = encodeHashState(state);
    if (encoded && encoded.length < 32000) {
      history.replaceState(null, "", "#s=" + encoded);
      savedHash = true;
    }
  } catch (e) {}
  idbSaveState(serialized);

  if (pill) pill.textContent = (savedLocal || savedHash) ? "✓ Salvato" : "⚠️ Usa ⬇️ JSON";
}

function scheduleSave() { saveNow(); }

window.addEventListener("beforeprint", saveNow);
window.addEventListener("pagehide", saveNow);
window.addEventListener("beforeunload", saveNow);
window.addEventListener("pageshow", function(ev) {
  if (ev.persisted || !loadedFromStorage) { state = loadState(); renderApp(); idbRestoreIfNeeded(); }
});
document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible" && !loadedFromStorage) { state = loadState(); renderApp(); idbRestoreIfNeeded(); }
});

function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getMasteryExplanation(masteryStr) {

function getPB() { return Math.floor((Number(state.level || 1) - 1) / 4) + 2; }
function getMod(score) { return Math.floor((Number(score || 10) - 10) / 2); }
function fmtMod(m) { return m >= 0 ? `+${m}` : `${m}`; }
function getActiveBurgerObj() { return BURGERS_DATA.find(b => b.id === state.activeBurger) || null; }
function getActiveFriesObj() { return FRIES_DATA.find(f => f.id === state.activeFries) || null; }

/* FEATURE RESOURCE TRACKER HELPERS */
function getTrackedFeatures() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const sp = SPECIES_DATA[state.species] || SPECIES_DATA["Umano"];
  const lvl = Number(state.level || 1);
  const pb = getPB();
  const list = [
    ...sp.traits.map(t => ({ ...t, source: state.species })),
    ...(BASE_CLASS_FEATURES[state.className] || []).filter(f => f.lvl <= lvl).map(f => ({ ...f, source: state.className })),
    ...cls.features.filter(f => f.lvl <= lvl).map(f => ({ ...f, source: cls.subName }))
  ];
  return list.filter(item => item.resId && typeof item.maxFn === "function").map(item => {
    const maxVal = Math.max(0, Number(item.maxFn(lvl, pb, state.stats) || 0));
    const usedVal = Math.max(0, Math.min(maxVal, Number(state.featureUses[item.resId] || 0)));
    return { ...item, maxVal, usedVal, availVal: Math.max(0, maxVal - usedVal) };
  }).filter(item => item.maxVal > 0);
}

function changeFeatureUse(resId, delta, maxVal) {
  const cur = Number(state.featureUses[resId] || 0);
  state.featureUses[resId] = Math.max(0, Math.min(maxVal, cur + delta));
  scheduleSave();
  renderApp();
}

function hasShieldInInventory() {
  if (state.hasShield) return true;
  const invText = String(state.inventory || "").toLowerCase();
  const notesText = String(state.notes || "").toLowerCase();
  const otherText = String(state.otherProfs || "").toLowerCase();
  return /scudo/i.test(invText) || /scudo/i.test(notesText) || /scudo/i.test(otherText);
}

function getCalculatedAC() {
  const dexMod = getMod(state.stats.DES);
  let baseAC = 10 + dexMod;
  if (state.armorIndex >= 0 && state.armorIndex < ARMOR_PRESETS.length) {
    const ar = ARMOR_PRESETS[state.armorIndex];
    baseAC = ar.base + Math.min(dexMod, ar.dexCap);
  } else {
    baseAC = Number(state.customArmorBase || 10);
  }
  const shield = state.hasShield ? 2 : 0;
  const burgerAC = (getActiveBurgerObj()?.bonusType === "ac") ? getActiveBurgerObj().bonusVal : 0;
  return baseAC + shield + Number(state.miscAcBonus || 0) + burgerAC;
}

function getInitiative() {
  let init = getMod(state.stats.DES);
  if (state.species === "Umano" && state.originFeat.startsWith("Allerta")) init += getPB();
  return init;
}

function getSpeed() {
  let spd = SPECIES_DATA[state.species]?.speed || 9;
  if (state.activeFries === "fries_chili") spd += 3;
  spd -= Number(state.exhaustion || 0) * 1.5;
  return Math.max(0, spd);
}

function getSkillBonus(skill) {
  const base = getMod(state.stats[skill.stat]);
  const prof = Number(state.skillProfs[skill.id] || 0) * getPB();
  const burgerCheck = (getActiveBurgerObj()?.bonusType === "check") ? getActiveBurgerObj().bonusVal : 0;
  return base + prof + burgerCheck;
}

function getSaveBonus(statKey) {
  const base = getMod(state.stats[statKey]);
  const prof = state.saveProfs[statKey] ? getPB() : 0;
  const burgerSave = (getActiveBurgerObj()?.bonusType === "save") ? getActiveBurgerObj().bonusVal : 0;
  const friesSave = (state.activeFries === "fries_bacon") ? 1 : 0;
  return base + prof + burgerSave + friesSave;
}

function getPassivePerception() {
  const percSkill = SKILLS_LIST.find(s => s.id === "percezione");
  let pp = 10 + getSkillBonus(percSkill);
  if (state.activeFries === "fries_onion") pp += 5;
  return pp;
}

function logRoll(title, detail, total) {
  const now = new Date();
  const timeStr = now.toTimeString().slice(0, 5);
  rollHistory.unshift({ title, detail, total, time: timeStr });
  if (rollHistory.length > 10) rollHistory.pop();
}

function showDiceToast(title, detail, total, d20Raw = null) {
  logRoll(title, detail, total);
  const toast = document.getElementById("dice-toast");
  document.getElementById("toast-title").textContent = title;
  document.getElementById("toast-detail").textContent = detail;
  document.getElementById("toast-total").textContent = total;
  toast.classList.remove("crit", "fumble");
  if (d20Raw === 20) toast.classList.add("crit");
  if (d20Raw === 1) toast.classList.add("fumble");
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3800);
}

function rollD20(label, bonus, overrideMode = null) {
  const mode = overrideMode || rollMode;
  const d1 = Math.floor(Math.random() * 20) + 1;
  const d2 = Math.floor(Math.random() * 20) + 1;
  let chosen = d1;
  let rollTxt = `1d20 (${d1})`;
  if (mode === "adv") {
    chosen = Math.max(d1, d2);
    rollTxt = `Vantaggio [${d1}, ${d2}] → ${chosen}`;
  } else if (mode === "dis") {
    chosen = Math.min(d1, d2);
    rollTxt = `Svantaggio [${d1}, ${d2}] → ${chosen}`;
  }
  const exhPen = Number(state.exhaustion || 0) * 2;
  const total = chosen + bonus - exhPen;
  const penTxt = exhPen > 0 ? ` - ${exhPen} (Esaur.)` : "";
  const critTxt = chosen === 20 ? " • CRITICO!" : (chosen === 1 ? " • FALLIMENTO CRITICO!" : "");
  showDiceToast(label, `${rollTxt} ${fmtMod(bonus)}${penTxt}${critTxt}`, total, chosen);
}

function rollFormula(label, formula) {
  const m = String(formula).trim().match(/^(\d+)d(\d+)([+-]\d+)?$/i);
  if (!m) {
    const val = Math.floor(Math.random() * 20) + 1;
    showDiceToast(label, `1d20 (${val})`, val, val);
    return val;
  }
  const count = parseInt(m[1], 10);
  const sides = parseInt(m[2], 10);
  const mod = m[3] ? parseInt(m[3], 10) : 0;
  let rolls = [];
  let sum = 0;
  for (let i = 0; i < count; i++) {
    const r = Math.floor(Math.random() * sides) + 1;
    rolls.push(r);
    sum += r;
  }
  const total = sum + mod;
  const modTxt = mod !== 0 ? (mod > 0 ? ` + ${mod}` : ` - ${Math.abs(mod)}`) : "";
  showDiceToast(label, `${count}d${sides} [${rolls.join("+")}]${modTxt}`, total, sides === 20 && count === 1 ? rolls[0] : null);
  return total;
}

function handlePortraitUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = 220;
      canvas.height = 220;
      const ctx = canvas.getContext("2d");
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2;
      const sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 220, 220);
      state.portrait = canvas.toDataURL("image/jpeg", 0.72);
      scheduleSave();
      renderApp();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function adjustHP(delta) {
  if (delta < 0) {
    let dmg = Math.abs(delta);
    if (state.hpTemp > 0) {
      const absorbed = Math.min(state.hpTemp, dmg);
      state.hpTemp -= absorbed;
      dmg -= absorbed;
    }
    state.hpCurrent = Math.max(0, state.hpCurrent - dmg);
  } else {
    state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + delta);
  }
  scheduleSave();
  renderApp();
}

function spendHitDie() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const maxHD = Number(state.level || 1);
  const usedHD = Number(state.hdUsed || 0);
  if (usedHD >= maxHD) {
    showDiceToast("Dadi Vita Esauriti", `Hai già speso tutti i ${maxHD}d${cls.hd} disponibili!`, "0 DV");
    return;
  }
  const conMod = getMod(state.stats.COS);
  const roll = Math.floor(Math.random() * cls.hd) + 1;
  const healed = Math.max(1, roll + conMod);
  state.hdUsed = usedHD + 1;
  const prevHP = state.hpCurrent;
  state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + healed);
  const actualHealed = state.hpCurrent - prevHP;
  scheduleSave();
  renderApp();
  showDiceToast(`Dado Vita Speso (1d${cls.hd})`, `Tiro (${roll}) ${fmtMod(conMod)} COS = +${healed} PF (recuperati ${actualHealed} PF) • Rimasti: ${maxHD - state.hdUsed}/${maxHD}`, `+${healed} PF`);
}

function resetFeatureUsesOnRest(isLong) {
  const tracked = getTrackedFeatures();
  const lvl = Number(state.level || 1);
  tracked.forEach(item => {
    if (isLong) {
      state.featureUses[item.resId] = 0;
    } else {
      if (item.rest === "short") state.featureUses[item.resId] = 0;
      else if (item.rest === "short1") state.featureUses[item.resId] = Math.max(0, Number(state.featureUses[item.resId] || 0) - 1);
      else if (item.rest === "bard" && lvl >= 5) state.featureUses[item.resId] = 0;
    }
  });
}

function shortRest() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const maxHD = Number(state.level || 1);
  const availHD = Math.max(0, maxHD - Number(state.hdUsed || 0));
  let notes = [];
  if (cls.pactMagic) {
    Object.keys(state.spellSlots).forEach(lvl => { state.spellSlots[lvl].used = 0; });
    notes.push("Slot Magia del Patto ripristinati");
  }
  resetFeatureUsesOnRest(false);
  notes.push(`DV disp.: ${availHD}/${maxHD} d${cls.hd}`);
  scheduleSave();
  renderApp();
  showDiceToast("Riposo Breve (1 ora)", notes.join(" • ") + " — Risorse brevi ricaricate!", "☕");
}

function longRest() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  state.hpCurrent = state.hpMax;
  state.hpTemp = 0;
  state.hdUsed = 0;
  state.deathSaves = { succ: [false, false, false], fail: [false, false, false] };
  state.exhaustion = Math.max(0, Number(state.exhaustion || 0) - 1);
  if (state.species === "Umano") state.inspiration = true;
  Object.keys(state.spellSlots).forEach(lvl => { state.spellSlots[lvl].used = 0; });
  resetFeatureUsesOnRest(true);
  state.magicItems.forEach(it => { if (it.maxCharges) it.charges = it.maxCharges; });
  (state.gearItems || []).forEach(g => { if (g.maxCharges) g.charges = g.maxCharges * Math.max(1, Number(g.qty || 1)); });
  scheduleSave();
  renderApp();
  showDiceToast("Riposo Lungo Completato", `PF massimi, Dadi Vita, privilegi, slot e cariche ripristinati!`, "🏕️");
}

function eatBurger(id) {
  const b = BURGERS_DATA.find(x => x.id === id);
  if (!b) return;
  if ((state.burgerPantry[id] || 0) > 0) state.burgerPantry[id]--;
  const healed = rollFormula(`Morso: ${b.name}`, b.heal);
  state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + healed);
  state.activeBurger = id;
  scheduleSave();
  renderApp();
}

function eatFries(id) {
  const f = FRIES_DATA.find(x => x.id === id);
  if (!f) return;
  if ((state.friesPantry[id] || 0) > 0) state.friesPantry[id]--;
  state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + 1);
  state.activeFries = id;
  showDiceToast(`King Fries: ${f.name}`, f.desc, "+1 PF");
  scheduleSave();
  renderApp();
}

function syncInventoryTextFromGear() {
  state.inventory = (state.gearItems || [])
    .filter(g => Number(g.qty || 0) > 0)
    .map(g => {
      const chTxt = g.maxCharges > 0 ? ` [${g.charges}/${g.maxCharges * g.qty} cariche]` : "";
      return `${g.qty > 1 ? g.qty + "× " : ""}${g.name}${chTxt}${g.note ? " (" + g.note + ")" : ""}`;
    })
    .join("\n");
}

function useGearItemAction(idx) {
  const item = state.gearItems[idx];
  if (!item) return;
  const lowName = item.name.toLowerCase();
  const healMatch = `${item.name} ${item.note}`.match(/(\d+d\d+\s*\+\s*\d+)/i);

  if (healMatch) {
    const formula = healMatch[1].replace(/\s+/g, "");
    const healed = rollFormula(`Uso: ${item.name}`, formula);
    state.hpCurrent = Math.min(state.hpMax, state.hpCurrent + healed);
    changeGearQty(idx, -1);
    return;
  }

  if (lowName.includes("frecce") || lowName.includes("quadrelli") || item.category === "Munizioni") {
    changeGearQty(idx, -1);
    showDiceToast("Munizione Scoccata", `Rimaste: ${Math.max(0, Number(item.qty || 0))} ${item.name}`, "-1");
    return;
  }

  if (item.maxCharges > 0 && item.charges > 0) {
    changeGearCharge(idx, -1);
    showDiceToast(`Carica Spesa: ${item.name}`, `Cariche rimaste: ${item.charges}/${item.maxCharges * item.qty}`, "-1");
    return;
  }

  changeGearQty(idx, -1);
  showDiceToast(`Oggetto Usato`, `${item.name} consumato (-1).`, "-1");
}

function changeGearQty(idx, delta) {
  const item = state.gearItems[idx];
  if (!item) return;
  const oldQty = Math.max(1, Number(item.qty || 1));
  const newQty = oldQty + delta;
  if (newQty <= 0) {
    state.gearItems.splice(idx, 1);
  } else {
    item.qty = newQty;
    if (item.maxCharges > 0) {
      if (delta > 0) {
        item.charges = Math.min(item.maxCharges * newQty, Number(item.charges || 0) + item.maxCharges * delta);
      } else {
        item.charges = Math.min(item.maxCharges * newQty, Number(item.charges || 0));
      }
    }
  }
  syncInventoryTextFromGear();
  scheduleSave();
  renderApp();
}

function changeGearCharge(idx, delta) {
  const item = state.gearItems[idx];
  if (!item || !(item.maxCharges > 0)) return;
  const totalMax = item.maxCharges * Math.max(1, Number(item.qty || 1));
  item.charges = Math.max(0, Math.min(totalMax, Number(item.charges || 0) + delta));
  syncInventoryTextFromGear();
  scheduleSave();
  renderApp();
}

function addGearPreset() {
  const sel = document.getElementById("gear-preset-sel");
  if (!sel) return;
  const gp = GEAR_PRESETS[Number(sel.value)];
  if (!gp) return;
  const existing = state.gearItems.find(x => x.name.toLowerCase() === gp.name.toLowerCase() && (x.category || "Attrezzatura") === gp.category);
  if (existing) {
    const addQty = Math.max(1, Number(gp.qty || 1));
    existing.qty = Number(existing.qty || 1) + addQty;
    if (existing.maxCharges > 0) {
      existing.charges = Math.min(existing.maxCharges * existing.qty, Number(existing.charges || 0) + existing.maxCharges * addQty);
    }
  } else {
    const initQty = Math.max(1, Number(gp.qty || 1));
    const maxCh = Math.max(0, Number(gp.maxCharges || 0));
    state.gearItems.push({ ...gp, qty: initQty, maxCharges: maxCh, charges: maxCh * initQty });
  }
  syncInventoryTextFromGear();
  scheduleSave();
  renderApp();
  showDiceToast("Oggetto Aggiunto", `${gp.qty > 1 ? gp.qty + "× " : ""}${gp.name}`, "🎒");
}

function addCustomGearItem() {
  const nameEl = document.getElementById("custom-gear-name");
  const qtyEl = document.getElementById("custom-gear-qty");
  const catEl = document.getElementById("custom-gear-cat");
  const chEl = document.getElementById("custom-gear-charges");
  const noteEl = document.getElementById("custom-gear-note");
  const name = (nameEl?.value || "").trim();
  if (!name) return;
  const qty = Math.max(1, Number(qtyEl?.value || 1));
  const category = catEl?.value || "Attrezzatura";
  const maxCharges = Math.max(0, Number(chEl?.value || 0));
  const note = (noteEl?.value || "").trim();

  const existing = state.gearItems.find(x => x.name.toLowerCase() === name.toLowerCase() && (x.category || "Attrezzatura") === category && Number(x.maxCharges || 0) === maxCharges);
  if (existing) {
    existing.qty = Number(existing.qty || 1) + qty;
    if (maxCharges > 0) {
      existing.charges = Math.min(maxCharges * existing.qty, Number(existing.charges || 0) + maxCharges * qty);
    }
    if (note && !existing.note) existing.note = note;
  } else {
    state.gearItems.push({ name, qty, category, note, maxCharges, charges: maxCharges * qty });
  }
  syncInventoryTextFromGear();
  scheduleSave();
  renderApp();
  showDiceToast("Oggetto Aggiunto", `${qty}× ${name}`, "🎒");
}

function renderBKTab() {
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const sp = SPECIES_DATA[state.species] || SPECIES_DATA["Umano"];
  const dis = editMode ? "" : "disabled";
  const lvl = Number(state.level || 1);
  const pb = getPB();

  const renderTrackerBadge = (item) => {
    if (!item.resId || typeof item.maxFn !== "function") return "";
    const maxVal = Math.max(0, Number(item.maxFn(lvl, pb, state.stats) || 0));
    if (maxVal <= 0) return "";
    const usedVal = Math.max(0, Math.min(maxVal, Number(state.featureUses[item.resId] || 0)));
    const avail = maxVal - usedVal;
    return `
      <div style="display:inline-flex;align-items:center;gap:4px;margin-right:4px;" onclick="event.stopPropagation();">
        <span style="font-size:10.5px;font-weight:900;background:#FFF8E1;color:#502314;border:1px solid var(--bk-gold);padding:1px 6px;border-radius:5px;">Usi: ${avail}/${maxVal}</span>
        <button class="roll-pill" style="padding:1px 6px;font-size:10.5px;" onclick="changeFeatureUse('${item.resId}', 1, ${maxVal})">-1</button>
        <button class="roll-pill" style="padding:1px 6px;font-size:10.5px;" onclick="changeFeatureUse('${item.resId}', -1, ${maxVal})">+1</button>
      </div>
    `;
  };

  const allBaseFeats = BASE_CLASS_FEATURES[state.className] || [];
  const visibleBaseFeats = editMode ? allBaseFeats : allBaseFeats.filter(f => Number(f.lvl) <= lvl);

  const baseFeaturesHtml = visibleBaseFeats.map((f, i) => `
    <div class="acc-item" id="bk-base-${i}">
      <div class="acc-head" onclick="document.getElementById('bk-base-${i}').classList.toggle('open')">
        <div style="flex:1;">
          <span class="acc-title">${esc(f.name)}</span>
          <div style="font-size:11.5px;color:#6e5041;">${esc(f.short)}</div>
        </div>
        <div style="display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
          ${renderTrackerBadge(f)}
          <span class="acc-tag" style="background:#7A3B26;">Liv. ${f.lvl}° ${lvl >= Number(f.lvl) ? "✓" : "🔒"}</span>
        </div>
      </div>
      <div class="acc-body">${esc(f.desc)}</div>
    </div>
  `).join("");

  const visibleFeatures = editMode ? cls.features : cls.features.filter(f => Number(f.lvl) <= lvl);

  const subFeatures = visibleFeatures.map((f, i) => `
    <div class="acc-item open" id="bk-sub-${i}">
      <div class="acc-head" onclick="document.getElementById('bk-sub-${i}').classList.toggle('open')">
        <div style="flex:1;">
          <span class="acc-title">${esc(f.name)}</span>
          <div style="font-size:11.5px;color:#6e5041;">${esc(f.short)}</div>
        </div>
        <div style="display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
          ${renderTrackerBadge(f)}
          <span class="acc-tag">Liv. ${f.lvl}° ${lvl >= Number(f.lvl) ? "✓" : "🔒"}</span>
        </div>
      </div>
      <div class="acc-body">${esc(f.desc)}</div>
    </div>
  `).join("");

  const spTraits = sp.traits.map((t, i) => `
    <div class="acc-item" id="bk-sp-${i}">
      <div class="acc-head" onclick="document.getElementById('bk-sp-${i}').classList.toggle('open')">
        <div style="flex:1;">
          <span class="acc-title">${esc(t.name)}</span>
          <div style="font-size:11.5px;color:#6e5041;">${esc(t.short)}</div>
        </div>
        <div style="display:flex;align-items:center;">
          ${renderTrackerBadge(t)}
          <span class="acc-tag">${esc(state.species)} ▾</span>
        </div>
      </div>
      <div class="acc-body">${esc(t.desc)}</div>
    </div>
  `).join("");

  return `
    <div class="card">
      <div class="card-title"><span>⚔️ Privilegi di Classe Base: ${esc(state.className)} (5.5e)</span></div>
      ${baseFeaturesHtml}
    </div>

    <div class="card">
      <div class="card-title"><span>🔥 Sottoclasse Esclusiva: ${esc(cls.subName)} (${esc(state.className)})</span></div>
      ${state.className === "Paladino" ? `
        <div style="margin-bottom:10px;">
          <label class="lbl">Scuola dell'Ordine Reale</label>
          <select ${dis} onchange="updateField('paladinSchool', this.value);renderApp();">
            <option value="Shake-a-Lot" ${state.paladinSchool === "Shake-a-Lot" ? "selected" : ""}>Scuola Shake-a-Lot (Gelo & Difesa)</option>
            <option value="King's Blade" ${state.paladinSchool === "King's Blade" ? "selected" : ""}>Scuola King's Blade (Fiamme & Assalto)</option>
          </select>
        </div>
      ` : ""}
      ${subFeatures}
    </div>

    <div class="card">
      <div class="card-title"><span>🧬 Tratti di Specie (${esc(state.species)}) & Talento d'Origine 5.5e</span></div>
      ${spTraits}
      ${state.species === "Umano" ? `
        <div style="margin-top:8px;">
          <label class="lbl">Talento d'Origine 5.5e (Versatile)</label>
          <select ${dis} onchange="updateField('originFeat', this.value);renderApp();">
            ${ORIGIN_FEATS.map(of => `<option value="${esc(of)}" ${state.originFeat === of ? "selected" : ""}>${esc(of)}</option>`).join("")}
          </select>
          ${state.originFeat === "Personalizzato" ? `
            <input type="text" style="margin-top:6px;" placeholder="Scrivi il nome e l'effetto del Talento d'Origine..." ${dis} value="${esc(state.customOriginFeat)}" oninput="updateField('customOriginFeat', this.value)">
          ` : ""}
        </div>
      ` : ""}
    </div>
  `;
}

let selectedCraftRecipeIdx = 0;

function isRecipeCraftable(recipe) {
  return Object.keys(recipe.req || {}).every(ing => Number(state.ingredients[ing] || 0) >= Number(recipe.req[ing] || 0));
}

function craftSelectedFood() {
  const sel = document.getElementById("craft-recipe-sel");
  const idx = sel ? Number(sel.value) : selectedCraftRecipeIdx;
  selectedCraftRecipeIdx = idx;
  const rec = CRAFTING_RECIPES[idx];
  if (!rec) return;

  if (!isRecipeCraftable(rec)) {
    showDiceToast("Ingredienti Insufficienti", `Non hai abbastanza ingredienti nella dispensa per preparare ${rec.name}.`, "⚠️");
    return;
  }

  Object.keys(rec.req).forEach(ing => {
    state.ingredients[ing] = Math.max(0, Number(state.ingredients[ing] || 0) - Number(rec.req[ing] || 0));
  });

  if (rec.outType === "burger") {
    state.burgerPantry[rec.outId] = Number(state.burgerPantry[rec.outId] || 0) + 1;
  } else {
    state.friesPantry[rec.outId] = Number(state.friesPantry[rec.outId] || 0) + 1;
  }

  scheduleSave();
  renderApp();
  showDiceToast("Preparazione Completata!", `Hai cucinato 1× ${rec.name} ed è stato aggiunto alla tua bisaccia!`, "🍽️");
}

function castSpellByName(name) {
  const idx = state.spells.findIndex(s => s.name === name);
  if (idx !== -1) castSpell(idx);
}

function castSpell(idx) {
  const sp = state.spells[idx];
  if (!sp) return;
  const cls = CLASSES_DATA[state.className] || CLASSES_DATA["Guerriero"];
  const casterStat = cls.caster || "CAR";
  const diceMatch = String(sp.note || "").match(/(\d+d\d+(?:\s*[+-]\s*\d+)?)/i);
  const rawDice = diceMatch ? diceMatch[1].replace(/\s+/g, "") : "";
  const usesCastMod = /\+\s*mod\./i.test(sp.note || "");
  const castModVal = cls.caster ? getMod(state.stats[casterStat]) : 0;
  const fullDice = rawDice ? (usesCastMod ? `${rawDice}${castModVal >= 0 ? "+" + castModVal : castModVal}` : rawDice) : "";

  if (sp.level > 0) {
    let slotUsedLvl = 0;
    for (let l = sp.level; l <= 5; l++) {
      const s = state.spellSlots[l];
      if (s && s.used < s.max) {
        s.used++;
        slotUsedLvl = l;
        break;
      }
    }
    if (!slotUsedLvl) {
      showDiceToast("Slot Esauriti!", `Nessuno slot di ${sp.level}° livello o superiore disponibile per ${sp.name}.`, "⚠️");
      return;
    }
    scheduleSave();
    renderApp();
    if (fullDice) {
      rollFormula(`Lancio ${sp.name} (Slot ${slotUsedLvl}°)`, fullDice);
    } else {
      showDiceToast(`Incantesimo Lanciato`, `${sp.name} (consumato 1 slot di ${slotUsedLvl}° livello)`, `Slot ${slotUsedLvl}°`);
    }
  } else {
    if (fullDice) rollFormula(`Trucchetto: ${sp.name}`, fullDice);
    else showDiceToast(`Trucchetto Lanciato`, sp.name, "0°");
  }
}

  const slotsHtml = [1, 2, 3, 4, 5].map(lvl => {
    const s = state.spellSlots[lvl] || { max: 0, used: 0 };

      <div class="vital-box">

          ${fullDice ? `<button class="roll-pill" onclick="rollFormula('${esc(sp.name)}', '${fullDice}')">🎲 ${fullDice}</button>` : ""}

  return `

  const status = document.getElementById("dp-status")?.value || "Visitato";

function hasMagicAccess() {
  const cls = CLASSES_DATA[state.className];
  const hasCasterClass = Boolean(cls && cls.caster);
  const hasMagicInitiate = state.species === "Umano" && String(state.originFeat || "").startsWith("Iniziato alla Magia");
  const hasMagicSpecies = ["Elfo", "Tiefling", "Gnomo"].includes(state.species);
  const hasSpells = Array.isArray(state.spells) && state.spells.length > 0;
  const hasSlots = Object.values(state.spellSlots || {}).some(s => Number(s.max || 0) > 0);
  return hasCasterClass || hasMagicInitiate || hasMagicSpecies || hasSpells || hasSlots;
}

function updateMagicTabVisibility() {
  const magicBtn = document.querySelector('.nav-tab[data-tab="magic"]');
  if (!magicBtn) return;
  const show = hasMagicAccess();
  magicBtn.style.display = show ? "flex" : "none";
  if (!show && currentTab === "magic") {
    currentTab = "home";
    document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === "home"));
  }
}

function renderApp() {
  document.getElementById("top-char-name").textContent = state.name || "Eroe della Griglia";
  const topInsp = document.getElementById("top-insp-badge");
  if (topInsp) {
    topInsp.style.background = state.inspiration ? "#F5A623" : "rgba(255,255,255,0.1)";
    topInsp.style.color = state.inspiration ? "#24130D" : "rgba(255,255,255,0.65)";
    topInsp.textContent = state.inspiration ? "★ Ispirazione" : "☆ Ispirazione";
  }
  updateMagicTabVisibility();
  const root = document.getElementById("app-content");
  if (currentTab === "home") root.innerHTML = renderHomeTab();
  else if (currentTab === "stats") root.innerHTML = renderStatsTab();
  else if (currentTab === "combat") root.innerHTML = renderCombatTab();
  else if (currentTab === "bk") root.innerHTML = renderBKTab();
  else if (currentTab === "food") root.innerHTML = renderFoodTab();
  else if (currentTab === "magic") root.innerHTML = renderMagicTab();
  else if (currentTab === "diary") root.innerHTML = renderDiaryTab();
  renderPrintSheet();
}

function exportJSON() {
  saveNow();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${(state.name || "eroe_bk").toLowerCase().replace(/\s+/g, "_")}_55e.json`;
  a.click();
}

function importJSON(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const parsed = JSON.parse(ev.target.result);
      state = migrateState(parsed);
      saveNow();
      renderApp();
      showDiceToast("Scheda Caricata", `${state.name} (${state.className} Liv. ${state.level}) importato!`, "✓");
    } catch (err) {
      alert("File JSON non valido.");
    } finally {
      e.target.value = "";
    }
  };
  reader.readAsText(file);
}

function resetSheet() {
  if (confirm("Vuoi ripristinare la scheda con un nuovo personaggio?")) {
    openWizard();
  }
}

function computeDefaultSlots(className, level) {
  const lvl = Math.max(1, Math.min(20, Number(level || 1)));
  const cls = CLASSES_DATA[className] || CLASSES_DATA["Guerriero"];
  const slots = { 1: {max:0,used:0}, 2: {max:0,used:0}, 3: {max:0,used:0}, 4: {max:0,used:0}, 5: {max:0,used:0} };
  if (!cls.caster) return slots;
  if (cls.pactMagic) {
    const pactCount = lvl === 1 ? 1 : (lvl <= 10 ? 2 : (lvl <= 16 ? 3 : 4));
    const pactLvl = Math.min(5, Math.ceil(lvl / 2));
    slots[pactLvl].max = pactCount;
    return slots;
  }
  const effLvl = cls.halfCaster ? Math.ceil(lvl / 2) : lvl;
  const fullTable = {
    1: [2,0,0,0,0], 2: [3,0,0,0,0], 3: [4,2,0,0,0], 4: [4,3,0,0,0],
    5: [4,3,2,0,0], 6: [4,3,3,0,0], 7: [4,3,3,1,0], 8: [4,3,3,2,0],
    9: [4,3,3,3,1], 10: [4,3,3,3,2]
  };
  const row = fullTable[Math.min(10, effLvl)] || [4,3,3,3,2];
  row.forEach((cnt, idx) => { slots[idx + 1].max = cnt; });
  return slots;
}

  document.getElementById("wizard-modal").classList.remove("open");
}

function getWizardFinalStats() {
  const out = {};
  Object.keys(wizDraft.baseStats).forEach(k => {
    let v = Number(wizDraft.baseStats[k] || 10);
    if (wizDraft.bgPlus2 === k) v += 2;
    if (wizDraft.bgPlus1 === k) v += 1;
    out[k] = Math.min(20, v);
  });
  return out;
}

function getWizardMaxSkills() {
  let maxSk = wizDraft.className === "Ladro" ? 4 : (wizDraft.className === "Bardo" ? 3 : 2);
  maxSk += 2;
  if (wizDraft.species === "Umano") maxSk += 1;
  if (wizDraft.species === "Elfo") maxSk += 1;
  if (wizDraft.species === "Umano" && String(wizDraft.originFeat || "").startsWith("Abile")) maxSk += 3;
  return maxSk;
}

function finishWizard() {
  const fresh = defaultState();
  const cls = CLASSES_DATA[wizDraft.className];
  const fin = getWizardFinalStats();
  const conMod = getMod(fin.COS);
  const dwarfBonus = wizDraft.species === "Nano" ? wizDraft.level : 0;
  const toughBonus = (wizDraft.species === "Umano" && wizDraft.originFeat.startsWith("Robusto")) ? (wizDraft.level * 2) : 0;
  const avgHitDie = Math.floor(cls.hd / 2) + 1;
  const calcHP = Math.max(1, cls.hd + conMod + ((wizDraft.level - 1) * (avgHitDie + conMod)) + dwarfBonus + toughBonus);

  fresh.name = wizDraft.name || "Eroe della Griglia";
  fresh.className = wizDraft.className;
  fresh.species = wizDraft.species;
  fresh.originFeat = wizDraft.originFeat;
  fresh.paladinSchool = wizDraft.paladinSchool;
  fresh.level = wizDraft.level;
  fresh.stats = fin;
  fresh.hpMax = calcHP;
  fresh.hpCurrent = calcHP;
  fresh.saveProfs = { FOR: false, DES: false, COS: false, INT: false, SAG: false, CAR: false };
  cls.saves.forEach(s => { fresh.saveProfs[s] = true; });
  Object.keys(wizDraft.selectedSkills).forEach(k => { if (wizDraft.selectedSkills[k]) fresh.skillProfs[k] = 1; });
  fresh.tools = { ...wizDraft.selectedTools };
  fresh.spellSlots = computeDefaultSlots(wizDraft.className, wizDraft.level);

  const preset = CLASS_DEFAULT_GEAR[wizDraft.className] || CLASS_DEFAULT_GEAR["Guerriero"];
  if (wizDraft.gearPack === "class") {
    fresh.armorIndex = preset.armorIndex;
    fresh.hasShield = preset.hasShield;
    fresh.gold = preset.gold;
    fresh.weapons = JSON.parse(JSON.stringify(preset.weapons));
    fresh.gearItems = normalizeGearItemsList(JSON.parse(JSON.stringify(preset.gear || [])));
    fresh.spells = JSON.parse(JSON.stringify(preset.spells));
  } else {
    fresh.armorIndex = 0;
    fresh.hasShield = false;
    fresh.gold = 150;
    fresh.weapons = [];
    fresh.gearItems = [];
    fresh.spells = JSON.parse(JSON.stringify(preset.spells));
  }

  fresh.burgerPantry.whopper = 1;
  fresh.friesPantry.fries_base = 1;
  fresh.ingredients["Pane al Sesamo"] = 2;
  fresh.ingredients["Carne alla Griglia"] = 2;
  fresh.ingredients["Salsa King / Maionese"] = 1;
  fresh.inspiration = (wizDraft.species === "Umano");

  state = fresh;
  syncInventoryTextFromGear();
  saveNow();
  closeWizard();
  editMode = false;
  const btn = document.getElementById("btn-toggle-lock");
  btn.textContent = "🔒 Bloccata";
  btn.classList.remove("unlocked");
  switchTab("home");
  showDiceToast("Personaggio Creato!", `${state.name} è pronto per l'avventura!`, "👑");
}

/* ==================== SEARCH & CATALOG HELPERS ==================== */
function filterSelectOptions(inputId, selectId) {
  const input = document.getElementById(inputId);
  const sel = document.getElementById(selectId);
  if (!input || !sel) return;
  const q = input.value.toLowerCase().trim();
  let firstVisible = -1;
  Array.from(sel.options).forEach((opt, i) => {
    const match = !q || opt.text.toLowerCase().includes(q);
    opt.style.display = match ? "" : "none";
    opt.hidden = !match;
    if (match && firstVisible === -1) firstVisible = i;
  });
  if (firstVisible !== -1 && sel.options[sel.selectedIndex]?.hidden) {
    sel.selectedIndex = firstVisible;
  }
}

function filterFoodList(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll("#app-content .acc-item, #app-content .chk-item").forEach(el => {
    const match = !q || el.textContent.toLowerCase().includes(q);
    el.style.display = match ? "" : "none";
  });
  document.querySelectorAll("#app-content .ing-cat-group").forEach(grp => {
    const hasVisibleItem = Array.from(grp.querySelectorAll(".chk-item")).some(it => it.style.display !== "none");
    grp.style.display = (!q || hasVisibleItem) ? "" : "none";
  });
}

function previewSpellCatalog(idxStr) {
  const sp = SPELL_CATALOG[Number(idxStr)];
  const el = document.getElementById("spell-catalog-preview");
  if (sp && el) el.textContent = `${sp.range} • ${sp.note}`;
}

function addSpellFromCatalog() {
  const sel = document.getElementById("spell-catalog-sel");
  if (!sel) return;
  const sp = SPELL_CATALOG[Number(sel.value)];
  if (!sp) return;
  if (state.spells.some(x => x.name === sp.name)) {
    showDiceToast("Già Presente", `${sp.name} è già nel tuo grimorio.`, "ℹ️");
    return;
  }
  state.spells.push({ level: sp.level, name: sp.name, time: sp.time, range: sp.range, prep: true, note: sp.note });
  scheduleSave();
  renderApp();
  showDiceToast("Incantesimo Aggiunto", `${sp.name} (${sp.level === 0 ? "Trucchetto" : sp.level + "° liv."})`, "✨");
}

function autoLoadSubclassSpells() {
  const cls = CLASSES_DATA[state.className];
  const subKey = state.className === "Paladino" ? `${cls.subName} (${state.paladinSchool})` : cls.subName;
  const map = {
    "Collegio del Bardbecue": ["Controllare Fiamme", "Produrre Fiamma", "Sfera Infuocata"],
    "Mago Molecolare": ["Controllare Fiamme", "Controllare Acqua (Trucchetto)", "Modellare la Terra", "Folata di Vento (Trucchetto)"],
    "Circolo del Raccolto Rabbioso": ["Bacca Benefica", "Intrappolare", "Crescita di Spine", "Restaurazione Inferiore", "Crescita Vegetale", "Evoca Animali", "Piaga", "Tralcio Afferrante"],
    "Dominio del Digiuno": ["Camuffare Sé Stessi", "Individuazione del Magico", "Calmare Emozioni", "Vedere Invisibilità", "Chiaroveggenza", "Schema Ipnotico", "Invisibilità Superiore", "Occhio Arcano", "Modificare Memoria", "Scrutare"],
    "Patrono del Fuoco Primordiale": ["Creare Falò", "Controllare Fiamme", "Deflagrazione Occulta (Fuoco)", "Mani Brucianti", "Raggio Rovente", "Palla di Fuoco", "Protezione dall'Energia", "Evoca Elementale (Fuoco)", "Muro di Fuoco", "Colonna di Fiamma", "Immolazione"],
    "Giuramento del Burger Knight (Shake-a-Lot)": ["Eroismo", "Scudo della Fede", "Vincolo Protettivo", "Protezione dall'Energia", "Tempesta di Nevischio", "Libertà di Movimento", "Tempesta di Ghiaccio", "Cono di Freddo", "Muro di Ghiaccio"],
    "Giuramento del Burger Knight (King's Blade)": ["Mani Brucianti", "Punizione Ustionante", "Punizione Marchiante", "Raggio Rovente", "Arma Elementale (Fuoco)", "Palla di Fuoco", "Muro di Fuoco", "Scudo di Fuoco (Caldo)", "Colonna di Fiamma", "Immolazione"]
  };
  const names = map[subKey] || [];
  let added = 0;
  names.forEach(n => {
    const found = SPELL_CATALOG.find(s => s.name === n);
    if (found && !state.spells.some(x => x.name === found.name)) {
      state.spells.push({ level: found.level, name: found.name, time: found.time, range: found.range, prep: true, note: found.note });
      added++;
    }
  });
  if (added > 0) {
    scheduleSave();
    renderApp();
    showDiceToast("Incantesimi Sottoclasse", `Aggiunti ${added} incantesimi per ${subKey}!`, "✨");
  } else {
    showDiceToast("Nessun Nuovo Incantesimo", `Tutti gli incantesimi di ${subKey} sono già presenti (o la sottoclasse non ha liste dedicate).`, "ℹ️");
  }
}

renderApp();
idbRestoreIfNeeded();
</script>
